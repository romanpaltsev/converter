# nginx внутри контейнера: раздаёт собранный сайт (dist).
# add_header в location отменяет унаследованные заголовки, поэтому каждый location подключает свой набор.
# snippets/robots.conf создаётся при сборке образа: X-Robots-Tag noindex, если PUBLIC_INDEXING != true.

# страница 404 на языке раздела
map $uri $not_found_page {
    ~^/en(/|$)  /en/404.html;
    default     /404.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # снаружи стоит nginx хоста с HTTPS — редиректы делаем относительными
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

    gzip on;
    gzip_static on;   # готовые .gz (сжаты при сборке образа с -9)
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain application/wasm;

    error_page 404 $not_found_page;

    # хешированные ассеты сборки (включая WASM) — кэш на год
    location /_astro/ {
        include /etc/nginx/snippets/headers-asset.conf;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/snippets/headers-page.conf;
        try_files /index.html =404;
    }

    # канонические адреса: /heic-v-jpg/ → /heic-v-jpg; разделы вроде /en/ отдаются как есть
    location ~ ^(?<page>/.+)/$ {
        include /etc/nginx/snippets/headers-page.conf;
        if (-f $document_root$page.html) {
            return 301 $page$is_args$args;
        }
        try_files ${uri}index.html =404;
    }

    location / {
        include /etc/nginx/snippets/headers-page.conf;
        try_files $uri $uri.html @section;
    }

    # /en без слеша → /en/
    location @section {
        include /etc/nginx/snippets/headers-page.conf;
        if (-f $document_root$uri/index.html) {
            return 301 $uri/$is_args$args;
        }
        return 404;
    }

    # страницы 404 открываются только как ответ на несуществующий адрес
    location ~ ^(/en)?/404\.html$ {
        include /etc/nginx/snippets/headers-page.conf;
        internal;
    }
}
