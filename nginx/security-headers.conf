# Заголовки безопасности для всех ответов (в том числе JS: worker берёт CSP из своего ответа).
# Подключается через include в каждом location: add_header внутри location отменяет унаследованные.
# Этот же файл читает тестовый сервер scripts/serve-dist.mjs — формат: одна директива add_header на строку.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
