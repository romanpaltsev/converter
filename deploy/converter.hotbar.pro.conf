# server-блоки nginx хоста для тестовой площадки converter.hotbar.pro.
# Контейнер слушает 127.0.0.1:8090 (HOST_PORT в .env). Установка — DEPLOY.md, шаг 7:
# до сертификата включается только HTTP-блок (всё до строки «# ---- HTTPS»), Certbot получает сертификат
# (certbot certonly --nginx), затем ставится весь файл.

server {
    listen 80;
    listen [::]:80;
    server_name converter.hotbar.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: включается после получения сертификата ----
server {
    # nginx 1.24 (Ubuntu 24.04) знает http2 только как параметр listen; в nginx ≥ 1.25.1 это работает
    # с предупреждением, там можно заменить на отдельную строку «http2 on;»
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name converter.hotbar.pro;

    ssl_certificate /etc/letsencrypt/live/converter.hotbar.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/converter.hotbar.pro/privkey.pem;
    # оба файла создаёт плагин nginx для Certbot при первом запуске
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Закрыть тестовую площадку паролем (по желанию; htpasswd — из пакета apache2-utils):
    #   sudo htpasswd -c /etc/nginx/.htpasswd-converter tester
    # auth_basic "Converter (test)";
    # auth_basic_user_file /etc/nginx/.htpasswd-converter;

    # HSTS включайте только когда уверены, что HTTPS останется навсегда:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # загрузок на сервер нет — тела запросов не нужны
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
