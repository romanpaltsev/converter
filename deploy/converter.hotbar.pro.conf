# Пример server-блока nginx на хосте для тестовой площадки converter.hotbar.pro.
# Контейнер слушает 127.0.0.1:8090 (HOST_PORT в .env). Пошагово — в DEPLOY.md.
#
# 1) Положите файл в /etc/nginx/sites-available/, сделайте ссылку в sites-enabled, nginx -t && systemctl reload nginx.
# 2) Получите сертификат: certbot --nginx -d converter.hotbar.pro
#    Certbot сам допишет ssl_certificate и редирект с HTTP — блок ниже уже в таком виде.

server {
    listen 80;
    listen [::]:80;
    server_name converter.hotbar.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # для nginx старше 1.25.1: listen 443 ssl http2;
    server_name converter.hotbar.pro;

    ssl_certificate /etc/letsencrypt/live/converter.hotbar.pro/fullchain.pem;     # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/converter.hotbar.pro/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                               # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                 # managed by Certbot

    # Закрыть тестовую площадку паролем (по желанию):
    #   htpasswd -c /etc/nginx/.htpasswd-converter tester
    # auth_basic "Converter (test)";
    # auth_basic_user_file /etc/nginx/.htpasswd-converter;

    # HSTS включайте только когда уверены, что HTTPS останется навсегда:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # загрузок на сервер нет — тела запросов не нужны
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
