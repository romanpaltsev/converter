why:
  title: "Почему здесь"
  items:
    - title: "Книги остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Файлы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Главы с новой страницы"
      text: "Титул с обложкой, названием и авторами, затем главы — каждая с новой страницы, с заголовками и иллюстрациями."
    - title: "Кириллица и выделение текста"
      text: "Текст набран шрифтом с кириллицей и остаётся текстом: его можно выделять, искать и копировать."
    - title: "Сразу много книг"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить EPUB в PDF?"
      a: "PDF открывается на любом компьютере и телефоне без читалки, его удобно печатать и отправлять."
    - q: "Как выглядит PDF?"
      a: "Страницы A4: титул с обложкой, названием и авторами, затем главы — каждая с новой страницы. Текст набран шрифтом с кириллицей, его можно выделять и искать, иллюстрации — на своих местах."
    - q: "Сохранится ли вёрстка книги?"
      a: "Сохраняются текст и структура: главы, заголовки, абзацы, начертание, списки, цитаты, таблицы и иллюстрации. Оформление из CSS книги — шрифты, отступы, колонки — не переносится: PDF набирается единообразно."
    - q: "Что будет с картинками?"
      a: "Обложка и иллюстрации в JPEG и PNG переносятся. Картинки в других форматах читалки поддерживают плохо, поэтому они пропускаются, а в строке файла появляется предупреждение."
    - q: "Подойдут ли купленные книги?"
      a: "Книги с защитой от копирования (DRM) прочитать нельзя. Книги без защиты — из библиотек, личные и большинство бесплатных — конвертируются как обычно."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а книга обрабатывается в вашем браузере и не отправляется на сервер."
