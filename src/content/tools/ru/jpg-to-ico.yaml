howTo:
  title: "Как сделать ICO из JPG"
  steps:
    - "Нажмите на область выше или перетащите на неё JPG — лучше квадратную картинку от 256 × 256 пикселей."
    - "Подождите немного: иконка собирается прямо в браузере, файлы никуда не отправляются."
