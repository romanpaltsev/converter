title: "JPG в ICO онлайн — иконка и фавикон из фото, без загрузки"
description: "Сделайте иконку ICO из JPG прямо в браузере: фавикон для сайта или иконку Windows, все размеры от 16 до 256 пикселей в одном файле. Бесплатно и без регистрации."
h1: "Конвертер JPG в ICO"
subtitle: "Фавикон и иконка Windows. Файлы не покидают ваше устройство."
breadcrumb: "JPG в ICO"
card:
  title: "JPG → ICO"
  text: "Иконка или фавикон из фотографии — все размеры в одном файле."
app:
