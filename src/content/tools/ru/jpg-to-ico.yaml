why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Иконка собирается на вашем устройстве. Фото не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Все размеры в одном файле"
      text: "В ICO попадают размеры 16, 32, 48, 64, 128 и 256 пикселей — система и браузер сами выберут подходящий."
    - title: "Поворот учитывается"
      text: "Фото с телефона поворачивается так же, как в галерее, а прямоугольный снимок аккуратно вписывается в квадрат."
    - title: "Чёткие маленькие размеры"
      text: "Каждый размер уменьшается отдельно фильтром Lanczos, поэтому даже иконка 16 × 16 не выглядит размытой кашей."
faq:
  title: "Частые вопросы"
  items:
    - q: "Как сделать фавикон для сайта?"
      a: "Сконвертируйте логотип в ICO, назовите файл favicon.ico и положите в корень сайта. Браузеры найдут его сами; для надёжности добавьте в код страницы строку <link rel=\"icon\" href=\"/favicon.ico\">."
    - q: "Какие размеры будут в иконке?"
      a: "16, 32, 48, 64, 128 и 256 пикселей — но не больше исходной картинки: иконку из маленького изображения не раздуваем."
    - q: "Что будет с прямоугольным фото?"
      a: "Иконки квадратные, поэтому фото целиком впишется в квадрат, а по краям появятся прозрачные поля. Если нужна иконка без полей, заранее обрежьте фото до квадрата."
    - q: "Будет ли у иконки прозрачный фон?"
      a: "У JPG прозрачности нет, поэтому фон фото останется в иконке. Прозрачными будут только поля вокруг прямоугольного снимка. Для логотипа на прозрачном фоне используйте PNG."
    - q: "Подойдёт ли иконка для Windows?"
      a: "Да. ICO с размерами до 256 × 256 подходит для ярлыков, папок и программ в Windows 7, 10 и 11."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
