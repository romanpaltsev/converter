# Тексты страницы /pdf-v-png. Черновик для проверки владельцем (см. CONTENT.md).
title: "PDF в PNG онлайн — страницы PDF в картинки без потерь"
description: "Переведите PDF в PNG прямо в браузере: каждая страница — отдельная картинка без потерь, 72, 150 или 300 dpi. Без регистрации и загрузки на сервер."
h1: "PDF в PNG"
subtitle: "Страницы PDF — в картинки без потери качества. Файлы не покидают ваше устройство."
breadcrumb: "PDF в PNG"
card:
  title: "PDF в PNG"
  text: "Страницы PDF — в картинки PNG без потерь."
app:
  name: "Конвертер PDF в PNG"
  description: "Онлайн-сервис, который сохраняет страницы PDF как изображения PNG прямо в браузере, без загрузки файлов на сервер."
howTo:
  title: "Как перевести PDF в PNG"
  steps:
    - "Выберите разрешение: 150 dpi — для экрана, 300 dpi — для печати и мелкого текста."
    - "Нажмите на область выше или перетащите на неё PDF — можно сразу несколько. Страницы появятся по мере готовности."
    - "Скачайте страницы по одной или все сразу ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Чёткий текст"
      text: "PNG хранит картинку без потерь: буквы, линии и таблицы остаются резкими, без артефактов сжатия."
    - title: "Документы остаются у вас"
      text: "PDF открывается и рисуется прямо в браузере — договоры, выписки и сканы не загружаются на сервер."
    - title: "Все страницы сразу"
      text: "Каждая страница сохраняется отдельной картинкой с номером в имени файла, а все вместе — одним ZIP-архивом."
    - title: "Для презентаций и инструкций"
      text: "Страницу PDF в PNG удобно вставить в презентацию, документ или инструкцию."
faq:
  title: "Частые вопросы"
  items:
    - q: "Чем PNG лучше JPG для страниц PDF?"
      a: "PNG сжимает без потерь, поэтому текст и линии остаются идеально чёткими. JPG меньше по размеру и лучше подходит для страниц с фотографиями."
    - q: "Почему PNG-файлы такие большие?"
      a: "Картинка без потерь весит больше, особенно при 300 dpi. Если важен размер, выберите 150 dpi или формат JPG."
    - q: "Какое разрешение выбрать?"
      a: "150 dpi подходит для экрана и презентаций. Для печати и мелкого текста выберите 300 dpi. 72 dpi — самые маленькие файлы."
    - q: "Будет ли у картинок прозрачный фон?"
      a: "Нет, страницы сохраняются на белом фоне — как на бумаге."
    - q: "Можно ли открыть PDF с паролем?"
      a: "Нет: защищённый паролем PDF нужно сначала открыть и сохранить копию без пароля. Если файл защищён, об этом будет сказано в его строке."
    - q: "Сколько страниц можно сохранить?"
      a: "До 300 страниц из одного PDF и до 100 файлов за раз. Очень большие страницы (например, чертежи) сохраняются с меньшим разрешением — в строке будет пометка."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам инструмент, а PDF обрабатывается в вашем браузере и не отправляется на сервер."
