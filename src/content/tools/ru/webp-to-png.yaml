faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое WebP?"
      a: "WebP — формат изображений от Google, популярный на сайтах: картинки в нём занимают мало места. Но многие программы и редакторы его до сих пор не открывают, поэтому картинку удобнее перевести в распространённый формат, например PNG."
    - q: "Когда лучше PNG, а когда JPG?"
      a: "PNG — если важны прозрачность или точная копия без потерь: для логотипов, иконок, скриншотов и картинок, которые будут дальше редактировать. JPG — для фотографий, когда важен небольшой размер файла."
    - q: "Сохранится ли прозрачность?"
      a: "Да. PNG поддерживает прозрачность, поэтому прозрачные области WebP останутся прозрачными."
    - q: "Почему PNG больше, чем WebP?"
      a: "PNG сжимает без потерь, а WebP часто хранит картинки с потерями и сжимает эффективнее, поэтому PNG обычно весит больше. Для фотографий, где важнее размер, выберите JPG."
    - q: "А если WebP анимированный?"
      a: "Анимация в PNG не переносится: сохранится первый кадр, а в строке файла появится предупреждение."
    - q: "Что происходит с метаданными?"
      a: "По умолчанию сохраняется дата съёмки, если она есть в WebP, а геолокация и другие сведения удаляются. Если отметить «Сохранить все метаданные», перенесутся все данные EXIF. Цветовой профиль переносится всегда."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
