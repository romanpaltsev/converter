why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Записи не загружаются на сервер, поэтому их не слышит никто, кроме вас."
    - title: "MP3 с битрейтом на выбор"
      text: "MP3 кодируется LAME — кодировщиком, который используют большинство программ. Битрейт — 128, 192, 256 или 320 кбит/с."
    - title: "Теги сохраняются"
      text: "Название, исполнитель, альбом и другие теги переносятся в новый файл."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое AAC?"
      a: "AAC — кодек, которым сжат звук в большинстве видео MP4, в записях iPhone и в музыке Apple. Файлы .aac — это поток AAC без контейнера; их открывают не все плееры и автомагнитолы, а MP3 понимают везде."
    - q: "Можно ли обойтись без перекодирования?"
      a: "Да, если подходит M4A: выберите его в меню формата, и поток AAC переложится в контейнер M4A как есть, без потерь. Такой файл понимают iPhone, Android и большинство плееров."
    - q: "Какой битрейт выбрать?"
      a: "192 кбит/с — хороший выбор для музыки, его используют музыкальные сервисы. 320 кбит/с — максимум для MP3: качество чуть выше, файл больше. Для речи, подкастов и лекций хватит 128 кбит/с."
    - q: "Теряется ли качество?"
      a: "И AAC, и MP3 сжимают с потерями, поэтому при конвертации качество немного снижается. Чтобы потери не были заметны, выберите битрейт не ниже исходного."
    - q: "Сколько файлов можно конвертировать за раз?"
      a: "До 100 файлов за раз. Готовые файлы можно скачать по одному или все сразу одним ZIP-архивом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а записи обрабатываются в вашем браузере и не отправляются на сервер."
