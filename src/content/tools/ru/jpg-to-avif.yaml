title: "JPG в AVIF онлайн — лёгкие картинки для сайта, без загрузки"
description: "Конвертируйте фото JPG в AVIF прямо в браузере: современный формат для сайтов, который при том же качестве обычно легче JPG. Бесплатно, без регистрации."
h1: "Конвертер JPG в AVIF"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "JPG в AVIF"
card:
