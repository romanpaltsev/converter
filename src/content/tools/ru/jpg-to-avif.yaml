howTo:
  title: "Как конвертировать JPG в AVIF"
  steps:
    - "Нажмите на область выше или перетащите на неё JPG-файлы — можно сразу несколько."
    - "Подождите: кодирование AVIF идёт прямо в браузере и занимает больше времени, чем JPG или WebP."
    - "Скачайте AVIF по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Фотографии не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Легче при том же качестве"
      text: "AVIF основан на видеокодеке AV1 и обычно сжимает фотографии сильнее, чем JPG. Размер до и после виден в строке каждого файла."
    - title: "Цвета и метаданные"
      text: "Цветовой профиль переносится в AVIF. По умолчанию сохраняется дата съёмки, а геолокация удаляется."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое AVIF?"
      a: "AVIF — современный формат изображений на основе видеокодека AV1. Его поддерживают все современные браузеры, поэтому он удобен для сайтов: страницы грузятся быстрее."
    - q: "Насколько AVIF меньше JPG?"
      a: "Зависит от снимка и выбранного качества. Обычно AVIF заметно легче JPG при сопоставимом качестве, но сжатый JPG может уменьшиться не так сильно. Размер до и после показан в строке каждого файла."
    - q: "Почему кодирование такое долгое?"
      a: "Кодировщик AV1 тщательно подбирает, как сжать каждый участок изображения. В браузере он работает в один поток, поэтому большое фото может кодироваться десятки секунд. Зато всё происходит на вашем устройстве."
    - q: "Какое качество выбрать?"
      a: "Значение по умолчанию — 75: на фотографиях разница с оригиналом обычно незаметна. Для превью и фонов можно уменьшить, для детальных снимков — увеличить."
    - q: "Откроется ли AVIF на компьютере?"
      a: "AVIF открывают современные браузеры и многие программы, в том числе просмотрщик фото в Windows 11 и macOS. Для старых программ надёжнее оставить JPG."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
