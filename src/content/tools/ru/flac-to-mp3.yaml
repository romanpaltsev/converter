why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Записи не загружаются на сервер, поэтому их не слышит никто, кроме вас."
    - title: "MP3 с битрейтом на выбор"
      text: "MP3 кодируется LAME — кодировщиком, который используют большинство программ. Битрейт — 128, 192, 256 или 320 кбит/с."
    - title: "Теги сохраняются"
      text: "Название, исполнитель, альбом и другие теги переносятся в новый файл."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить FLAC в MP3?"
      a: "FLAC сжимает без потерь, поэтому файлы большие. MP3 в несколько раз меньше и открывается на любом устройстве — удобно для телефона, автомагнитолы и старых плееров."
    - q: "Какой битрейт выбрать для музыки?"
      a: "Для музыки из FLAC лучше 256 или 320 кбит/с: 320 — максимум для MP3. 192 кбит/с — разумный компромисс, если важен размер."
    - q: "Теряется ли качество?"
      a: "MP3 сжимает с потерями, поэтому файл уже не будет точной копией. При 256–320 кбит/с разница обычно не слышна. Исходные FLAC стоит сохранить — из них всегда можно сделать новый MP3."
    - q: "Что будет с многоканальной записью?"
      a: "MP3 бывает только моно или стерео, поэтому запись с большим числом каналов сводится в стерео."
    - q: "Сохранятся ли название и исполнитель?"
      a: "Да. Теги исходного файла — название, исполнитель, альбом и другие — переносятся в новый файл."
    - q: "Сколько файлов можно конвертировать за раз?"
      a: "До 100 файлов за раз. Готовые файлы можно скачать по одному или все сразу одним ZIP-архивом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а записи обрабатываются в вашем браузере и не отправляются на сервер."
