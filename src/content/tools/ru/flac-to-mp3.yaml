  description: "Онлайн-конвертер аудио FLAC в MP3, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать FLAC в MP3"
  steps:
    - "Нажмите на область выше или перетащите на неё FLAC-файлы — можно сразу несколько."
    - "Подождите: звук перекодируется прямо в браузере, файлы никуда не отправляются. Ход виден в процентах."
