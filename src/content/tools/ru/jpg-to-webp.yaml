# Тексты страницы /jpg-v-webp. Черновик для проверки владельцем (см. CONTENT.md).
title: "JPG в WebP онлайн — картинки для сайта, бесплатно"
description: "Конвертируйте JPG в WebP прямо в браузере: качество настраивается, до 100 файлов за раз, файлы не загружаются на сервер. Бесплатно и без регистрации."
h1: "Конвертер JPG в WebP"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "JPG в WebP"
card:
  title: "JPG → WebP"
  text: "Картинки для сайта: настраиваемое качество, много файлов сразу."
app:
  name: "Конвертер JPG в WebP"
  description: "Онлайн-конвертер изображений JPG в WebP, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать JPG в WebP"
  steps:
    - "Нажмите на область выше или перетащите на неё JPG-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте WebP по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Качество под контролем"
      text: "Настройте качество ползунком; размер до и после конвертации виден в строке каждого файла."
    - title: "Поворот и цвета как в оригинале"
      text: "Если фото повёрнуто с помощью EXIF, WebP получится уже повёрнутым. Цветовой профиль переносится, поэтому цвета не меняются."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить JPG в WebP?"
      a: "WebP поддерживают все современные браузеры, поэтому его используют на сайтах: при сопоставимом качестве фотографии в WebP обычно занимают меньше места, чем в JPG, и страницы загружаются быстрее."
    - q: "Будет ли WebP меньше исходного JPG?"
      a: "Обычно да, но не всегда: если исходный JPG уже сильно сжат, выигрыш бывает небольшим. Размер до и после показан в строке файла — при необходимости уменьшите качество ползунком."
    - q: "Станет ли качество лучше?"
      a: "Нет. Конвертация не возвращает детали, потерянные при сжатии JPG, а сжатие с потерями ещё немного меняет картинку. При качестве 90 (значение по умолчанию) разница обычно не видна."
    - q: "Стоит ли включать «Без потерь»?"
      a: "Для фотографий из JPG — обычно нет: файл без потерь получится больше исходного. Этот режим полезен для графики, скриншотов и картинок, которые будут дальше редактировать."
    - q: "Сохранятся ли поворот и цвета?"
      a: "Да. Если камера записала поворот в EXIF, WebP получится уже повёрнутым как надо. Цветовой профиль (например, Display P3) переносится в WebP."
    - q: "Что происходит с метаданными?"
      a: "По умолчанию сохраняется дата съёмки, а геолокация, модель камеры и другие сведения удаляются. Если отметить «Сохранить все метаданные», в WebP перенесутся все данные EXIF, включая координаты."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
