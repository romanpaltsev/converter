# Тексты страницы /webp-v-jpg. Черновик для проверки владельцем (см. CONTENT.md).
title: "WebP в JPG онлайн — бесплатно, без загрузки на сервер"
description: "Конвертируйте картинки WebP в JPG прямо в браузере: бесплатно, без регистрации, файлы не загружаются на сервер. JPG откроется в любой программе."
h1: "Конвертер WebP в JPG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "WebP в JPG"
card:
  title: "WebP → JPG"
  text: "Картинки с сайтов — в формат, который открывается везде."
app:
  name: "Конвертер WebP в JPG"
  description: "Онлайн-конвертер изображений WebP в JPG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать WebP в JPG"
  steps:
    - "Нажмите на область выше или перетащите на неё WebP-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте JPG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Прозрачность — на белом фоне"
      text: "В JPG нет прозрачности, поэтому прозрачные области WebP аккуратно ложатся на белый фон, а не становятся чёрными."
    - title: "Сжатие MozJPEG"
      text: "JPG создаётся кодировщиком MozJPEG от Mozilla. Качество настраивается ползунком."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое WebP?"
      a: "WebP — формат изображений от Google, который используют многие сайты: картинки в нём занимают меньше места. Но его открывают не все программы, фоторедакторы и сервисы, поэтому скачанную с сайта картинку часто удобнее перевести в JPG."
    - q: "Почему картинка с сайта скачивается в WebP?"
      a: "Сайты отдают картинки в WebP, чтобы страницы грузились быстрее, и браузер сохраняет файл в том же формате. Конвертация в JPG делает картинку пригодной для любых программ."
    - q: "Теряется ли качество?"
      a: "JPG сжимает с потерями, поэтому картинка немного меняется. При качестве 90 (значение по умолчанию) разница обычно не видна. Если исходный WebP был без потерь и нужна точная копия, выберите PNG."
    - q: "Почему JPG больше, чем WebP?"
      a: "WebP обычно сжимает эффективнее JPG, поэтому та же картинка в JPG при сопоставимом качестве весит больше. Это нормально; уменьшите качество ползунком, если нужен файл поменьше."
    - q: "Что будет с прозрачностью и анимацией?"
      a: "В JPG нет прозрачности, поэтому прозрачные области становятся белыми. Анимация тоже не переносится: сохранится первый кадр, а в строке файла появится предупреждение."
    - q: "Что происходит с метаданными?"
      a: "По умолчанию сохраняется дата съёмки, если она есть в WebP, а геолокация и другие сведения удаляются. Если отметить «Сохранить все метаданные», перенесутся все данные EXIF. Цветовой профиль переносится всегда."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
