# Тексты страницы /udalit-metadannye-foto. Черновик для проверки владельцем (см. CONTENT.md).
title: "Удалить метаданные с фото онлайн — EXIF и геолокация"
description: "Удалите EXIF, геолокацию, модель телефона и другие метаданные из фото JPG, PNG, HEIC и WebP прямо в браузере — без перекодирования и загрузки на сервер."
h1: "Удалить метаданные с фото"
subtitle: "EXIF, геолокация и данные камеры — без перекодирования. Файлы не покидают ваше устройство."
breadcrumb: "Удалить метаданные"
card:
  title: "Удалить метаданные"
  text: "Убрать из фото геолокацию, модель телефона и другие данные EXIF."
app:
  name: "Удаление метаданных из фото"
  description: "Онлайн-сервис для удаления EXIF, геолокации и других метаданных из фотографий, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как удалить метаданные"
  steps:
    - "Выберите, что удалить: все метаданные, всё, кроме даты съёмки, или только геолокацию."
    - "Нажмите на область выше или перетащите на неё фото — можно сразу несколько. В строке каждого файла видно, что именно было удалено."
    - "Скачайте файлы по одному или все сразу ZIP-архивом. Формат и качество снимков не меняются."
why:
  title: "Почему здесь"
  items:
    - title: "Фото не загружаются на сервер"
      text: "Метаданные удаляются прямо на вашем устройстве. Никто, кроме вас, не увидит ни снимков, ни того, что в них было записано."
    - title: "Без потери качества"
      text: "Изображение не перекодируется: удаляются только служебные данные, а пиксели остаются байт в байт. Поэтому размер файла почти не меняется."
    - title: "Видно, что было удалено"
      text: "Для каждого файла показано, что нашлось: геолокация, модель камеры, дата, XMP, встроенная миниатюра или дополнительные изображения."
    - title: "Все популярные форматы"
      text: "JPG, PNG, HEIC с iPhone, WebP, AVIF, GIF, TIFF и JPEG XL — до 100 файлов за раз."
faq:
  title: "Частые вопросы"
  items:
    - q: "Какие метаданные хранятся в фото?"
      a: "Телефоны и камеры записывают в файл дату и время съёмки, модель устройства и объектива, параметры съёмки, а при включённой геолокации — координаты места. Программы добавляют свои данные: XMP с историей правок, IPTC с подписями и авторством, иногда — встроенную миниатюру."
    - q: "Как удалить геолокацию с фото?"
      a: "Выберите «Только геолокацию» и добавьте фото. Координаты будут удалены, а дата съёмки и модель камеры останутся. Блоки XMP и IPTC удаляются целиком: в них тоже бывает место съёмки."
    - q: "Можно ли сохранить дату съёмки?"
      a: "Да, выберите «Всё, кроме даты». Останутся дата и время съёмки — по ним галерея расставит снимки по порядку, — а всё остальное будет удалено."
    - q: "Ухудшится ли качество фото?"
      a: "Нет. Изображение не пересжимается: из файла убираются только служебные блоки, а сами пиксели не меняются. Поэтому и размер файла уменьшается совсем немного."
    - q: "Почему ориентация и цвета остались прежними?"
      a: "Мы специально оставляем ориентацию и цветовой профиль. Без ориентации вертикальный снимок показался бы на боку, а без профиля цвета фото с iPhone стали бы тусклее. Личных данных в них нет."
    - q: "Что будет с HEIC и «живыми фото»?"
      a: "HEIC с iPhone остаётся в формате HEIC: блоки EXIF и XMP внутри файла затираются на месте, поэтому размер файла не меняется. Видео «живых фото» с Android и дополнительные изображения внутри JPEG (карта HDR, глубина) удаляются: в них бывают свои метаданные."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам инструмент, а фото обрабатываются в вашем браузере и не отправляются на сервер."
    - q: "Как проверить, что метаданных не осталось?"
      a: "В строке каждого файла видно, что было удалено, а если удалять было нечего — «Метаданных не найдено». Проверить результат можно в свойствах файла или в любом просмотрщике EXIF."
