faq:
  title: "Частые вопросы"
  items:
    - q: "Как перевести фото с iPhone в PDF?"
      a: "Добавьте снимки HEIC (на iPhone — через «Файлы» или «Медиатеку»), расставьте их в нужном порядке и нажмите «Скачать PDF». Каждое фото станет страницей."
    - q: "Ухудшится ли качество?"
      a: "Фото HEIC сохраняются в PDF в высоком качестве (JPEG 90): на глаз отличий нет. Повороты и цвета снимков сохраняются."
    - q: "Почему iPhone присылает JPG вместо HEIC?"
      a: "При выборе фото iPhone иногда сам переводит HEIC в JPEG. Это не мешает: JPG тоже можно добавить, он попадёт в PDF без перекодирования."
    - q: "Можно ли смешать HEIC, JPG и PNG?"
      a: "Да: в один PDF можно собрать HEIC, JPG, PNG, WebP, AVIF и другие форматы."
    - q: "Какой размер страницы выбрать?"
      a: "Для документов и печати — A4 (в США — Letter); «По размеру фото» сделает каждую страницу ровно под снимок, без белых полей."
    - q: "Что с геолокацией и датой съёмки?"
      a: "В PDF попадают только изображения: геолокация, модель телефона и дата съёмки не переносятся."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам инструмент, а PDF собирается в вашем браузере — файлы не отправляются на сервер."
