# Тексты страницы /mp4-v-mp3. Черновик для проверки владельцем (см. CONTENT.md).
title: "MP4 в MP3 онлайн — извлечь звук из видео бесплатно"
description: "Извлеките звук из видео MP4 в MP3 прямо в браузере: бесплатно, без регистрации, видео не загружается на сервер. Подходят и MOV, WebM, MKV."
h1: "Конвертер MP4 в MP3"
subtitle: "Звук из видео — в MP3. Бесплатно, без регистрации, файлы не покидают ваше устройство."
breadcrumb: "MP4 в MP3"
card:
  title: "MP4 → MP3"
  text: "Звук из видео — в MP3 для плеера и телефона."
app:
  name: "Конвертер MP4 в MP3"
  description: "Онлайн-конвертер видео MP4 в MP3, который извлекает звук прямо в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать MP4 в MP3"
  steps:
    - "Нажмите на область выше или перетащите на неё MP4-файлы — можно сразу несколько."
    - "Подождите: звук перекодируется прямо в браузере, файлы никуда не отправляются. Ход виден в процентах."
    - "Скачайте MP3 по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Записи не загружаются на сервер, поэтому их не слышит никто, кроме вас."
    - title: "Только звук, без лишней работы"
      text: "Картинка видео не декодируется — из файла берётся звуковая дорожка, поэтому даже длинный ролик обрабатывается быстро."
    - title: "MP3 с битрейтом на выбор"
      text: "MP3 кодируется LAME — кодировщиком, который используют большинство программ. Битрейт — 128, 192, 256 или 320 кбит/с."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что получится из видео?"
      a: "Из видео берётся только звуковая дорожка: картинка не декодируется и в MP3 не попадает. Если в ролике несколько дорожек, например озвучки на разных языках, берётся основная."
    - q: "Какие видео подходят?"
      a: "MP4, MOV, WebM и MKV со звуком в распространённых кодеках — AAC, MP3, Opus, Vorbis, FLAC. Если браузер не умеет читать звук файла, в строке появится сообщение об этом."
    - q: "Какой битрейт выбрать?"
      a: "192 кбит/с — хороший выбор для музыки, его используют музыкальные сервисы. 320 кбит/с — максимум для MP3: качество чуть выше, файл больше. Для речи, подкастов и лекций хватит 128 кбит/с."
    - q: "Можно ли извлечь звук без перекодирования?"
      a: "MP3 всегда кодируется заново. Если нужен звук без дополнительных потерь, выберите M4A: звук AAC из MP4 переносится в M4A как есть."
    - q: "Что, если в видео нет звука?"
      a: "Тогда конвертировать нечего — в строке файла появится сообщение «В файле нет звуковой дорожки»."
    - q: "Есть ли ограничение по размеру видео?"
      a: "Жёсткого ограничения нет: видео читается по частям, а в памяти держится только готовый MP3. Длинный фильм обрабатывается дольше — ход виден в процентах."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а записи обрабатываются в вашем браузере и не отправляются на сервер."
