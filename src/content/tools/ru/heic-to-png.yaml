faq:
  title: "Частые вопросы"
  items:
    - q: "Чем PNG отличается от JPG?"
      a: "PNG сохраняет изображение без потерь: ни один пиксель не меняется. JPG сжимает с потерями, зато файлы получаются в разы меньше. Для обмена фото обычно удобнее JPG, для редактирования и печати — PNG."
    - q: "Почему PNG-файлы такие большие?"
      a: "Сжатие без потерь не может отбросить мелкие детали, а на фотографиях их очень много. Снимок iPhone на 24 Мп в PNG весит несколько десятков мегабайт. Если важен размер, выберите JPG."
    - q: "Что такое HEIC?"
      a: "HEIC — формат фотографий, в котором по умолчанию снимают iPhone и iPad. Он хранит снимки компактно, но открывается не везде: многие программы и сайты его не понимают."
    - q: "Сохраняется ли прозрачность?"
      a: "Да. Если в HEIC-файле есть прозрачность (альфа-канал), она переносится в PNG. Обычные снимки с камеры прозрачности не содержат."
    - q: "Сохранятся ли поворот и цвета снимка?"
      a: "Да. Фото будет повёрнуто так же, как в галерее телефона, а цветовой профиль (на iPhone это обычно Display P3) встраивается в PNG, поэтому цвета не тускнеют."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а фотографии обрабатываются в вашем браузере и не отправляются на сервер."
    - q: "Что происходит с геолокацией и датой съёмки?"
      a: "По умолчанию дата и время съёмки сохраняются, а геолокация, модель телефона и другие служебные данные удаляются. Если отметить «Сохранить все метаданные», в PNG перенесутся все данные EXIF, включая координаты."
