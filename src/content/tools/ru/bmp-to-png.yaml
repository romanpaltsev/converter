# Тексты страницы /bmp-v-png. Черновик для проверки владельцем (см. CONTENT.md).
title: "BMP в PNG онлайн — без потерь, без загрузки на сервер"
description: "Конвертируйте изображения BMP в PNG прямо в браузере: без потери качества и заметно легче. Бесплатно, без регистрации, файлы не загружаются на сервер."
h1: "Конвертер BMP в PNG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "BMP в PNG"
card:
  title: "BMP → PNG"
  text: "Без потерь и легче — для скриншотов, схем и редактирования."
app:
  name: "Конвертер BMP в PNG"
  description: "Онлайн-конвертер изображений BMP в PNG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать BMP в PNG"
  steps:
    - "Нажмите на область выше или перетащите на неё BMP-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте PNG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Без потерь"
      text: "PNG хранит каждый пиксель точно, как BMP, но сжимает данные — изображение не меняется, а файл становится легче."
    - title: "Прозрачность сохраняется"
      text: "Если в BMP есть альфа-канал, прозрачные области остаются прозрачными в PNG."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое BMP?"
      a: "BMP — старый формат изображений Windows. Обычно он хранит каждый пиксель без сжатия, поэтому файлы получаются большими, и многие сайты и мессенджеры их не принимают."
    - q: "Изменится ли изображение?"
      a: "Нет. PNG сжимает без потерь: все пиксели останутся точно такими же, как в BMP."
    - q: "Насколько уменьшится файл?"
      a: "Скриншоты, схемы и рисунки с однотонными областями сжимаются в PNG очень сильно. Фотографии — заметно слабее; для них может быть удобнее JPG."
    - q: "Какие BMP поддерживаются?"
      a: "Почти все, что встречаются на практике: 1, 4, 8, 16, 24 и 32 бита на пиксель, со сжатием RLE и без, включая файлы с прозрачностью и встроенным цветовым профилем."
    - q: "Сохранятся ли цвета?"
      a: "Да. Если в BMP встроен цветовой профиль, он переносится в PNG; если нет — используется sRGB, как и в самом BMP."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
