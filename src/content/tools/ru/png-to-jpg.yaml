# Тексты страницы /png-v-jpg. Черновик для проверки владельцем (см. CONTENT.md).
title: "PNG в JPG онлайн — бесплатно и прямо в браузере"
description: "Конвертируйте PNG в JPG прямо в браузере: бесплатно, без регистрации, файлы не загружаются на сервер. Прозрачный фон станет белым, качество настраивается."
h1: "Конвертер PNG в JPG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "PNG в JPG"
card:
  title: "PNG → JPG"
  text: "Когда нужен JPG: для сайтов, почты и печати фотографий."
app:
  name: "Конвертер PNG в JPG"
  description: "Онлайн-конвертер изображений PNG в JPG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать PNG в JPG"
  steps:
    - "Нажмите на область выше или перетащите на неё PNG-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте JPG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Прозрачность — на белом фоне"
      text: "В JPG нет прозрачности, поэтому прозрачные области аккуратно ложатся на белый фон, а не становятся чёрными."
    - title: "Сжатие MozJPEG"
      text: "JPG создаётся кодировщиком MozJPEG от Mozilla. Качество настраивается ползунком."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить PNG в JPG?"
      a: "JPG понимают практически все программы, сайты и сервисы, а фотографии в нём обычно занимают заметно меньше места, чем в PNG. Это удобно, если файл нужно отправить по почте, загрузить на сайт с ограничением размера или напечатать."
    - q: "Станет ли файл меньше?"
      a: "Для фотографий — обычно да: JPG сжимает их с потерями. А схемы, скриншоты с текстом и картинки с крупными однотонными областями PNG часто хранит компактнее — для них JPG может оказаться не меньше."
    - q: "Теряется ли качество?"
      a: "JPG сжимает изображение с потерями, поэтому картинка немного меняется. При качестве 90 (значение по умолчанию) на фотографиях разница обычно не видна. На тексте и тонких линиях могут появиться заметные артефакты — такие картинки лучше оставить в PNG."
    - q: "Что будет с прозрачным фоном?"
      a: "В JPG нет прозрачности, поэтому прозрачные области становятся белыми. Если прозрачность нужна, оставьте PNG."
    - q: "А если PNG анимированный?"
      a: "Анимация в JPG не переносится: сохранится первый кадр, а в строке файла появится предупреждение."
    - q: "Что происходит с метаданными?"
      a: "По умолчанию сохраняется дата съёмки, если она есть в PNG, а геолокация и другие сведения удаляются. Если отметить «Сохранить все метаданные», перенесутся все данные EXIF. Текстовые комментарии PNG в JPG не переносятся."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
