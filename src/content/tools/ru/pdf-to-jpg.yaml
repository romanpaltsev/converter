howTo:
  title: "Как перевести PDF в JPG"
  steps:
    - "Выберите разрешение: 150 dpi — для экрана и почты, 300 dpi — для печати. Формат можно сменить на PNG или WebP."
    - "Нажмите на область выше или перетащите на неё PDF — можно сразу несколько. Страницы появятся по мере готовности."
    - "Скачайте страницы по одной или все сразу ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Документы остаются у вас"
      text: "PDF открывается и рисуется прямо в браузере — договоры, выписки и сканы не загружаются на сервер."
    - title: "Чёткие страницы"
      text: "300 dpi — как у сканера: мелкий текст и таблицы читаются даже на печати."
    - title: "Все страницы сразу"
      text: "Каждая страница сохраняется отдельной картинкой с номером в имени файла, а все вместе — одним ZIP-архивом."
    - title: "JPG, PNG или WebP"
      text: "JPG — для фото и почты, PNG — для текста и схем без потерь, WebP — компактнее JPG."
faq:
  title: "Частые вопросы"
  items:
    - q: "Как сохранить одну страницу PDF как картинку?"
      a: "Добавьте PDF — каждая страница появится отдельной строкой. Скачайте нужную кнопкой «Скачать» в её строке."
    - q: "Какое разрешение выбрать?"
      a: "150 dpi подходит для экрана, мессенджеров и почты. Для печати и мелкого текста выберите 300 dpi — картинки будут чётче, но и тяжелее. 72 dpi — самые маленькие файлы."
    - q: "Что лучше: JPG или PNG?"
      a: "Для страниц с фотографиями — JPG: файлы меньше. Для текста, таблиц и схем — PNG: буквы останутся резкими, без ореолов сжатия."
    - q: "Можно ли открыть PDF с паролем?"
      a: "Нет: защищённый паролем PDF нужно сначала открыть и сохранить копию без пароля. Если файл защищён, об этом будет сказано в его строке."
    - q: "Можно ли будет выделить текст на картинке?"
      a: "Нет. Страница сохраняется как изображение: текст будет виден, но выделить или найти его в картинке нельзя."
    - q: "Сколько страниц можно сохранить?"
      a: "До 300 страниц из одного PDF и до 100 файлов за раз. Очень большие страницы (например, чертежи) сохраняются с меньшим разрешением — в строке будет пометка."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам инструмент, а PDF обрабатывается в вашем браузере и не отправляется на сервер."
