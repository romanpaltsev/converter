# Тексты страницы /tiff-v-png. Черновик для проверки владельцем (см. CONTENT.md).
title: "TIFF в PNG онлайн — без потерь, без загрузки на сервер"
description: "Конвертируйте изображения TIFF в PNG прямо в браузере: без потери качества, с прозрачностью. Бесплатно, без регистрации, файлы не загружаются на сервер."
h1: "Конвертер TIFF в PNG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "TIFF в PNG"
card:
  title: "TIFF → PNG"
  text: "Без потерь и с прозрачностью — формат, который открывается везде."
app:
  name: "Конвертер TIFF в PNG"
  description: "Онлайн-конвертер изображений TIFF в PNG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать TIFF в PNG"
  steps:
    - "Нажмите на область выше или перетащите на неё TIFF-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте PNG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Сканы документов и фотографии не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Без потерь"
      text: "PNG хранит каждый пиксель точно, поэтому изображение не меняется. 16-битные TIFF сохраняются с 8 битами на канал."
    - title: "Прозрачность сохраняется"
      text: "Если в TIFF есть альфа-канал, прозрачные области остаются прозрачными в PNG."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое TIFF?"
      a: "TIFF — формат для сканов, полиграфии и профессиональной фотографии. Его понимают не все программы и сайты, а PNG открывается везде."
    - q: "Изменится ли изображение?"
      a: "Пиксели переносятся без потерь. Единственное отличие — у 16-битных TIFF на выходе 8 бит на канал: на экране разницы не видно, но для глубокой цветокоррекции лучше оставить исходник."
    - q: "Что будет с многостраничным TIFF?"
      a: "Сохранится первая страница, а в строке файла появится пояснение. Если нужны все страницы, разделите файл на отдельные изображения."
    - q: "Какие TIFF поддерживаются?"
      a: "Почти все обычные: без сжатия и со сжатием LZW, Deflate (ZIP), PackBits, JPEG и CCITT (факсы и чёрно-белые сканы), 1–16 бит на канал, с прозрачностью и без. Изображения в CMYK и RAW-снимки камер (DNG, CR2, NEF) пока не поддерживаются."
    - q: "Сохранятся ли цвета?"
      a: "Да. Встроенный цветовой профиль переносится в PNG; если профиля нет, используется sRGB."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
