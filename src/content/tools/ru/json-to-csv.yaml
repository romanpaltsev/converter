# Тексты страницы /json-v-csv. Черновик для проверки владельцем (см. CONTENT.md).
title: "JSON в CSV онлайн — бесплатно, без загрузки на сервер"
description: "Конвертируйте JSON в CSV прямо в браузере: массив объектов становится таблицей со столбцами по ключам. Бесплатно, без регистрации и загрузки на сервер."
h1: "Конвертер JSON в CSV"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "JSON в CSV"
card:
  title: "JSON → CSV"
  text: "Массив JSON — в таблицу CSV для Excel."
app:
  name: "Конвертер JSON в CSV"
  description: "Онлайн-конвертер JSON в CSV, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать JSON в CSV"
  steps:
    - "Нажмите на область выше или перетащите на неё JSON-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте CSV по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Документы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Столбцы по ключам"
      text: "Все ключи объектов становятся столбцами в порядке появления — даже если у разных объектов они разные."
    - title: "Готово для Excel"
      text: "CSV в UTF-8 с меткой BOM и разделителем на выбор открывается в Excel без кракозябр."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Какой JSON подходит?"
      a: "Массив объектов ([{\"имя\": …}, …]) — каждый объект становится строкой, ключи — столбцами. Подходят и массив массивов, и объект, внутри которого один такой массив."
    - q: "Что будет с вложенными объектами?"
      a: "Вложенные объекты и массивы записываются в ячейку как текст JSON, а в строке файла появляется предупреждение."
    - q: "Почему разделитель — точка с запятой?"
      a: "Русский Excel открывает CSV с точкой с запятой, а с запятой показывает всё в одном столбце. Для Google Таблиц и программ выберите в настройках запятую."
    - q: "Что, если в JSON нет таблицы?"
      a: "Если это не массив объектов или массивов, конвертировать нечего — в строке файла появится сообщение об этом."
    - q: "Сколько файлов можно конвертировать за раз?"
      a: "До 100 файлов за раз. Готовые файлы можно скачать по одному или все сразу одним ZIP-архивом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а файл обрабатывается в вашем браузере и не отправляется на сервер."
