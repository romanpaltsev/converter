# Тексты страницы /md-v-html. Черновик для проверки владельцем (см. CONTENT.md).
title: "Markdown в HTML онлайн — MD в HTML бесплатно"
description: "Конвертируйте Markdown (.md) в готовую HTML-страницу прямо в браузере: таблицы, списки задач, код. Бесплатно, без регистрации и загрузки на сервер."
h1: "Конвертер Markdown в HTML"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "Markdown в HTML"
card:
  title: "Markdown → HTML"
  text: "Markdown — в готовую HTML-страницу с аккуратными стилями."
app:
  name: "Конвертер Markdown в HTML"
  description: "Онлайн-конвертер Markdown в HTML, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать Markdown в HTML"
  steps:
    - "Нажмите на область выше или перетащите на неё Markdown-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте HTML по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Документы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Готовая страница"
      text: "Получается самостоятельный HTML-файл с кодировкой, заголовком и аккуратными стилями — его можно сразу открыть в браузере."
    - title: "GitHub Flavored Markdown"
      text: "Таблицы, списки задач, зачёркивание и автоссылки — как на GitHub."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что получится на выходе?"
      a: "Файл .html со всей разметкой документа: заголовки, абзацы, списки, таблицы, код, ссылки и картинки (по тем же адресам, что в Markdown). Заголовок страницы — первый заголовок документа."
    - q: "Можно ли вставить результат на свой сайт?"
      a: "Да. Возьмите содержимое <body> — это чистая разметка без лишних классов — или используйте файл целиком."
    - q: "Сохранится ли HTML внутри Markdown?"
      a: "Да, HTML-вставки переносятся как есть."
    - q: "А если текст в другой кодировке?"
      a: "Кодировка определяется сама: UTF-8, UTF-16 или Windows-1251 — в ней сохраняют файлы старые версии «Блокнота» и русский Excel."
    - q: "Сколько файлов можно конвертировать за раз?"
      a: "До 100 файлов за раз. Готовые файлы можно скачать по одному или все сразу одним ZIP-архивом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а файл обрабатывается в вашем браузере и не отправляется на сервер."
