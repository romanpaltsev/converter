faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить MP3 в WAV?"
      a: "WAV нужен программам монтажа, звуковым редакторам, семплерам и устройствам, которые не понимают MP3. Звук в WAV хранится без сжатия, поэтому его удобно редактировать."
    - q: "Станет ли качество лучше?"
      a: "Нет. WAV точно передаёт то, что было в MP3, но детали, утраченные при сжатии в MP3, не вернутся. Зато при дальнейшей обработке качество больше не теряется."
    - q: "Почему WAV намного больше MP3?"
      a: "WAV хранит звук без сжатия: минута стерео при 44,1 кГц — около 10 МБ. Поэтому WAV обычно в 4–11 раз больше исходного MP3, в зависимости от его битрейта."
    - q: "Какой получится WAV?"
      a: "PCM 16 бит с той же частотой и тем же числом каналов, что у MP3, — обычно 44,1 кГц, стерео. Такой формат поддерживают все программы и устройства."
    - q: "Сколько файлов можно конвертировать за раз?"
      a: "До 100 файлов за раз. Готовые файлы можно скачать по одному или все сразу одним ZIP-архивом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а записи обрабатываются в вашем браузере и не отправляются на сервер."
