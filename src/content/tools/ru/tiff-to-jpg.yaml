# Тексты страницы /tiff-v-jpg. Черновик для проверки владельцем (см. CONTENT.md).
title: "TIFF в JPG онлайн — бесплатно, без загрузки на сервер"
description: "Конвертируйте сканы и фото TIFF в JPG прямо в браузере: файл станет в разы легче. Бесплатно, без регистрации, файлы не загружаются на сервер."
h1: "Конвертер TIFF в JPG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "TIFF в JPG"
card:
  title: "TIFF → JPG"
  text: "Сканы и фото TIFF — в лёгкий JPG для почты и сайтов."
app:
  name: "Конвертер TIFF в JPG"
  description: "Онлайн-конвертер изображений TIFF в JPG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать TIFF в JPG"
  steps:
    - "Нажмите на область выше или перетащите на неё TIFF-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте JPG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Сканы документов и фотографии не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Файл заметно легче"
      text: "TIFF обычно хранит изображение без сжатия или со сжатием без потерь, а JPG сжимает его — для фото и сканов файл становится в разы меньше."
    - title: "Цвета и поворот сохраняются"
      text: "Встроенный цветовой профиль переносится в JPG, а снимок поворачивается так, как задано в файле."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое TIFF?"
      a: "TIFF — формат для сканов, полиграфии и профессиональной фотографии. Он хранит изображение без потерь, поэтому файлы получаются большими, и многие сайты и мессенджеры их не принимают."
    - q: "Что будет с многостраничным TIFF?"
      a: "Сохранится первая страница, а в строке файла появится пояснение. Если нужны все страницы, разделите файл на отдельные изображения."
    - q: "Какие TIFF поддерживаются?"
      a: "Почти все обычные: без сжатия и со сжатием LZW, Deflate (ZIP), PackBits, JPEG и CCITT (факсы и чёрно-белые сканы), 1–16 бит на канал, с прозрачностью и без. Изображения в CMYK и RAW-снимки камер (DNG, CR2, NEF) пока не поддерживаются — в строке файла будет понятная ошибка."
    - q: "Теряется ли качество?"
      a: "JPG сжимает с потерями, поэтому изображение немного меняется. При качестве 90 (значение по умолчанию) разница на глаз обычно не видна. Если нужна точная копия, выберите PNG."
    - q: "Что происходит с метаданными?"
      a: "По умолчанию сохраняется только дата съёмки, а геолокация, модель камеры и другие сведения удаляются. Чтобы перенести их все, отметьте «Сохранить все метаданные». Цветовой профиль переносится всегда."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
