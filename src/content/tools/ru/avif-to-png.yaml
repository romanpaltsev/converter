faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое AVIF?"
      a: "AVIF — современный формат изображений на основе видеокодека AV1. Сайты используют его, потому что картинки в нём занимают мало места. Но многие программы и редакторы его пока не открывают, поэтому картинку удобнее перевести в распространённый формат, например PNG."
    - q: "Когда лучше PNG, а когда JPG?"
      a: "PNG — если важны прозрачность или точная копия без потерь: для логотипов, иконок, скриншотов и картинок, которые будут дальше редактировать. JPG — для фотографий, когда важен небольшой размер файла."
    - q: "Сохранится ли прозрачность?"
      a: "Да. PNG поддерживает прозрачность, поэтому прозрачные области AVIF останутся прозрачными."
    - q: "Почему PNG намного больше, чем AVIF?"
      a: "PNG сжимает без потерь, а AVIF хранит картинки с потерями и сжимает очень эффективно, поэтому PNG может весить в разы больше. Для фотографий, где важнее размер, выберите JPG."
    - q: "А если AVIF в HDR или с глубиной цвета 10 бит?"
      a: "PNG сохраняется с 8 битами на канал и в обычном диапазоне яркости. У HDR-изображений цвета могут немного отличаться — в строке файла появится предупреждение. У анимированного AVIF сохраняется основной кадр."
    - q: "Что происходит с метаданными?"
      a: "По умолчанию сохраняется дата съёмки, если она есть в AVIF, а геолокация и другие сведения удаляются. Если отметить «Сохранить все метаданные», перенесутся все данные EXIF. Цветовой профиль переносится всегда."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
