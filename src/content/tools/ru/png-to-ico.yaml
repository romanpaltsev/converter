title: "PNG в ICO онлайн — фавикон и иконка, без загрузки на сервер"
description: "Сделайте иконку ICO из PNG прямо в браузере: фавикон для сайта или иконку Windows, все размеры от 16 до 256 пикселей в одном файле. Бесплатно и без регистрации."
h1: "Конвертер PNG в ICO"
subtitle: "Фавикон и иконка Windows. Файлы не покидают ваше устройство."
breadcrumb: "PNG в ICO"
card:
  title: "PNG → ICO"
  text: "Фавикон для сайта или иконка Windows — все размеры в одном файле."
app:
  name: "Конвертер PNG в ICO"
  description: "Онлайн-конвертер PNG в ICO для фавиконов и иконок, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как сделать ICO из PNG"
  steps:
    - "Нажмите на область выше или перетащите на неё PNG — лучше квадратную картинку от 256 × 256 пикселей."
    - "Подождите немного: иконка собирается прямо в браузере, файлы никуда не отправляются."
    - "Скачайте ICO по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Иконка собирается на вашем устройстве. Картинки не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Все размеры в одном файле"
      text: "В ICO попадают размеры 16, 32, 48, 64, 128 и 256 пикселей — система и браузер сами выберут подходящий."
    - title: "Прозрачность сохраняется"
      text: "Прозрачный фон PNG остаётся прозрачным в иконке, а прямоугольная картинка аккуратно вписывается в квадрат."
    - title: "Чёткие маленькие размеры"
      text: "Каждый размер уменьшается отдельно фильтром Lanczos, поэтому даже иконка 16 × 16 не выглядит размытой кашей."
faq:
  title: "Частые вопросы"
  items:
    - q: "Как сделать фавикон для сайта?"
      a: "Сконвертируйте логотип в ICO, назовите файл favicon.ico и положите в корень сайта. Браузеры найдут его сами; для надёжности добавьте в код страницы строку <link rel=\"icon\" href=\"/favicon.ico\">."
    - q: "Какие размеры будут в иконке?"
      a: "16, 32, 48, 64, 128 и 256 пикселей — но не больше исходной картинки: иконку из маленького изображения не раздуваем. Из картинки меньше 16 пикселей получится один размер 16 × 16."
    - q: "Что будет с прямоугольной картинкой?"
      a: "Иконки квадратные, поэтому картинка целиком впишется в квадрат, а по краям появятся прозрачные поля. Ничего не обрезается."
    - q: "Сохранится ли прозрачность?"
      a: "Да. Каждый размер хранится внутри ICO как PNG с прозрачностью — так иконки хранят Windows и все современные браузеры."
    - q: "Подойдёт ли иконка для Windows?"
      a: "Да. ICO с размерами до 256 × 256 подходит для ярлыков, папок и программ в Windows 7, 10 и 11."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
