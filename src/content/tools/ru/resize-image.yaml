# Тексты страницы /izmenit-razmer-foto. Черновик для проверки владельцем (см. CONTENT.md).
title: "Изменить размер фото онлайн — в пикселях или процентах"
description: "Уменьшите фото и картинки JPG, PNG, WebP, HEIC и AVIF до нужного размера в пикселях или процентах прямо в браузере. Бесплатно, без регистрации и загрузки."
h1: "Изменить размер фото онлайн"
subtitle: "По длинной стороне, в процентах или до точных размеров. Файлы не покидают ваше устройство."
breadcrumb: "Изменить размер фото"
card:
  title: "Изменить размер"
  text: "Уменьшить фото до нужных пикселей — по стороне, в процентах или точно."
app:
  name: "Изменение размера фото онлайн"
  description: "Онлайн-сервис для уменьшения фотографий и картинок, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как изменить размер фото"
  steps:
    - "Выберите, как уменьшить: до длины длинной стороны (например, 1920 точек), в процентах или до точной ширины и высоты."
    - "Нажмите на область выше или перетащите на неё фото — можно сразу несколько. Всё происходит прямо в браузере."
    - "Скачайте файлы по одному или все сразу ZIP-архивом. В строке каждого файла видны размеры до и после."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Фото уменьшаются на вашем устройстве. Они не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Аккуратное уменьшение"
      text: "Используется фильтр Lanczos — тот же, что в графических редакторах: мелкие детали остаются чёткими, без «лесенок» на краях."
    - title: "Формат и поворот сохраняются"
      text: "JPG остаётся JPG, PNG — PNG с прозрачностью. Фото HEIC с iPhone и AVIF сохраняются в JPG. Снимок поворачивается так же, как в галерее."
    - title: "Сразу много файлов"
      text: "Уменьшите до 100 изображений за раз с одинаковыми настройками и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Как уменьшить фото до 1920 пикселей?"
      a: "Оставьте режим «По длинной стороне» и выберите 1920 — или впишите своё число. Длинная сторона станет 1920 точек, а короткая уменьшится пропорционально: снимок 4032 × 3024 превратится в 1920 × 1440."
    - q: "Чем отличаются режимы?"
      a: "«По длинной стороне» удобен для пачки фото разной ориентации: и горизонтальные, и вертикальные снимки станут не больше заданного. «В процентах» уменьшает каждое изображение во столько же раз. «Ширина и высота» вписывает изображение в рамку, а без галочки «Сохранять пропорции» растягивает точно до неё."
    - q: "Можно ли увеличить изображение?"
      a: "Нет, изображения только уменьшаются: при увеличении новых деталей не появляется, файл лишь становится больше. Если фото уже меньше заданного размера, оно сохранит свои размеры, а в строке файла появится пояснение."
    - q: "Ухудшится ли качество?"
      a: "Уменьшенное фото содержит меньше точек, но выглядит чётким: используется фильтр Lanczos. JPG и WebP сохраняются с качеством 90 — его можно изменить ползунком. PNG сохраняется без потерь."
    - q: "Уменьшится ли вес файла?"
      a: "Да, обычно заметно: если уменьшить фото вдвое по каждой стороне, точек станет вчетверо меньше. Чтобы уложиться в конкретный размер в килобайтах, воспользуйтесь страницей «Сжать фото»."
    - q: "Сохранится ли прозрачность?"
      a: "Да, если выбрать «Исходный» формат для PNG и WebP или формат PNG либо WebP явно. В JPG прозрачных областей нет — они станут белыми."
    - q: "Что происходит с геолокацией и датой съёмки?"
      a: "По умолчанию дата и время съёмки сохраняются, а геолокация, модель телефона и другие служебные данные удаляются. Чтобы перенести все метаданные, отметьте «Сохранить все метаданные»."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам инструмент, а фотографии обрабатываются в вашем браузере и не отправляются на сервер."
