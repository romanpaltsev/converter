# Тексты страницы /mp4-v-webm. Черновик для проверки владельцем (см. CONTENT.md).
title: "MP4 в WebM онлайн — бесплатно, без загрузки на сервер"
description: "Конвертируйте видео MP4 в WebM (VP9 и Opus) прямо в браузере: для сайтов и веб-приложений. Бесплатно, без регистрации и загрузки на сервер."
h1: "Конвертер MP4 в WebM"
subtitle: "Бесплатно и без регистрации. Видео не покидает ваше устройство."
breadcrumb: "MP4 в WebM"
card:
  title: "MP4 → WebM"
  text: "Видео для сайтов — в открытом формате WebM."
app:
  name: "Конвертер MP4 в WebM"
  description: "Онлайн-конвертер видео MP4 в WebM, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать MP4 в WebM"
  steps:
    - "Нажмите на область выше или перетащите на неё MP4-файлы — можно сразу несколько."
    - "Подождите: видео обрабатывается прямо в браузере и никуда не отправляется. Ход виден в процентах."
    - "Скачайте WebM по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Видео остаётся у вас"
      text: "Конвертация выполняется на вашем устройстве. Видео не загружается на сервер, поэтому его не видит никто, кроме вас."
    - title: "VP9 и Opus"
      text: "Видео кодируется в VP9, звук — в Opus: открытые кодеки без лицензионных отчислений, которые поддерживают все современные браузеры."
    - title: "Качество и размер на выбор"
      text: "Выберите качество и размер кадра — от исходного до 480p, чтобы видео быстрее грузилось на сайте."
    - title: "Сразу много файлов"
      text: "Добавьте несколько видео за раз и скачайте результат по одному или одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить MP4 в WebM?"
      a: "WebM — открытый формат видео для интернета. Его используют на сайтах как альтернативу MP4: VP9 при том же качестве обычно даёт файл меньше, чем H.264."
    - q: "Какие кодеки внутри?"
      a: "Видео — VP9 (если браузер его не кодирует — VP8 или AV1), звук — Opus."
    - q: "Откроется ли WebM на iPhone?"
      a: "Новые версии Safari и iOS воспроизводят WebM, но старые устройства и некоторые программы — нет. Если нужна максимальная совместимость, оставьте MP4."
    - q: "Почему конвертация идёт долго?"
      a: "Перекодирование видео — тяжёлая работа, и она идёт прямо на вашем устройстве. Минута видео обрабатывается от десятков секунд до нескольких минут — в зависимости от разрешения и компьютера. Ход виден в процентах."
    - q: "Как уменьшить размер файла?"
      a: "Выберите качество «Среднее» или «Низкое» и размер кадра поменьше — 720p или 480p. 720p означает, что короткая сторона кадра — 720 точек: у вертикального видео это ширина."
    - q: "В каком браузере работает?"
      a: "В свежих Chrome, Edge, Firefox и Safari: видео кодируется встроенными в браузер кодеками (WebCodecs). Если браузер не умеет нужный кодек, в строке файла появится сообщение об этом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а видео обрабатывается в вашем браузере и не отправляется на сервер."
