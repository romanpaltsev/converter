# Тексты страницы /gif-v-jpg. Черновик для проверки владельцем (см. CONTENT.md).
title: "GIF в JPG онлайн — бесплатно, без загрузки на сервер"
description: "Конвертируйте картинки GIF в JPG прямо в браузере: бесплатно, без регистрации, файлы не загружаются на сервер. Можно сразу много файлов."
h1: "Конвертер GIF в JPG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "GIF в JPG"
card:
  title: "GIF → JPG"
  text: "Картинку GIF — в обычное фото, которое принимают везде."
app:
  name: "Конвертер GIF в JPG"
  description: "Онлайн-конвертер изображений GIF в JPG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать GIF в JPG"
  steps:
    - "Нажмите на область выше или перетащите на неё GIF-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте JPG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Прозрачность — на белом фоне"
      text: "В JPG нет прозрачности, поэтому прозрачные области GIF ложатся на белый фон, а не становятся чёрными."
    - title: "Сжатие MozJPEG"
      text: "JPG создаётся кодировщиком MozJPEG от Mozilla. Качество настраивается ползунком."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что будет с анимированным GIF?"
      a: "JPG хранит только одно изображение, поэтому сохранится первый кадр анимации — тот, что виден до начала проигрывания. В строке файла появится пояснение."
    - q: "Станет ли картинка лучше?"
      a: "Нет. GIF хранит не больше 256 цветов, и конвертация не вернёт недостающие оттенки: JPG будет выглядеть так же, как исходный GIF."
    - q: "Будет ли JPG меньше, чем GIF?"
      a: "Для фотографий и картинок с плавными переходами — обычно да. Для схем, логотипов и рисунков с крупными однотонными областями GIF бывает компактнее; в строке каждого файла видно, как изменился размер."
    - q: "Что делать, если нужна прозрачность?"
      a: "В JPG прозрачных областей нет — они станут белыми. Чтобы сохранить прозрачность, выберите формат PNG или WebP."
    - q: "Сохранятся ли цвета?"
      a: "Да. Цвета палитры GIF переносятся как есть, а в JPG встраивается профиль sRGB, поэтому картинка выглядит одинаково во всех программах."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
