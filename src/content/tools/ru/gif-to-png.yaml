# Тексты страницы /gif-v-png. Черновик для проверки владельцем (см. CONTENT.md).
title: "GIF в PNG онлайн — с прозрачностью, без загрузки на сервер"
description: "Конвертируйте картинки GIF в PNG прямо в браузере: прозрачность сохраняется, файлы не загружаются на сервер. Бесплатно и без регистрации."
h1: "Конвертер GIF в PNG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "GIF в PNG"
card:
  title: "GIF → PNG"
  text: "Без потерь и с прозрачностью — для сайтов и редактирования."
app:
  name: "Конвертер GIF в PNG"
  description: "Онлайн-конвертер изображений GIF в PNG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать GIF в PNG"
  steps:
    - "Нажмите на область выше или перетащите на неё GIF-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте PNG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Прозрачность сохраняется"
      text: "Прозрачные области GIF остаются прозрачными в PNG — картинку можно класть на любой фон."
    - title: "Без потерь"
      text: "PNG хранит каждый пиксель точно, поэтому изображение не меняется ни на один оттенок."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что будет с анимированным GIF?"
      a: "Сохранится первый кадр анимации — тот, что виден до начала проигрывания. Анимацию PNG-файл здесь не получит, в строке файла появится пояснение."
    - q: "Сохранится ли прозрачность?"
      a: "Да. Прозрачные пиксели GIF остаются прозрачными в PNG. Если GIF меньше своего холста, свободная часть холста тоже будет прозрачной — так же, как в браузере."
    - q: "Изменится ли качество?"
      a: "Нет. PNG хранит изображение без потерь, поэтому все пиксели останутся точно такими же, как в GIF."
    - q: "Почему PNG бывает больше GIF?"
      a: "GIF хранит не больше 256 цветов, а PNG здесь сохраняется полноцветным, поэтому файл иногда получается немного больше. Изображение при этом не меняется."
    - q: "Зачем переводить GIF в PNG?"
      a: "PNG понимают все редакторы и сайты, он удобен для дальнейшей обработки и не ограничен 256 цветами — правки не будут портиться дизерингом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
