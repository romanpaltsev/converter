why:
  title: "Почему здесь"
  items:
    - title: "Книги остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Файлы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Главы и оглавление"
      text: "Название, авторы, аннотация, обложка, главы и иллюстрации переносятся, а оглавление собирается по главам."
