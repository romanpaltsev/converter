why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Цвета как в оригинале"
      text: "Цветовой профиль AVIF переносится в JPG, поэтому снимки с широким цветовым охватом не тускнеют."
    - title: "Сжатие MozJPEG"
      text: "JPG создаётся кодировщиком MozJPEG от Mozilla. Качество настраивается ползунком."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое AVIF?"
      a: "AVIF — современный формат изображений на основе видеокодека AV1. Сайты используют его, потому что картинки в нём занимают мало места. Но его открывают ещё не все программы, фоторедакторы и сервисы, поэтому картинку удобнее перевести в JPG."
    - q: "Почему картинка с сайта скачивается в AVIF?"
      a: "Сайты отдают картинки в AVIF, чтобы страницы грузились быстрее, и браузер сохраняет файл в том же формате. Конвертация в JPG делает картинку пригодной для любых программ."
    - q: "Теряется ли качество?"
      a: "JPG сжимает с потерями, поэтому картинка немного меняется. При качестве 90 (значение по умолчанию) разница обычно не видна. Если нужна точная копия без новых потерь, выберите PNG."
    - q: "Почему JPG больше, чем AVIF?"
      a: "AVIF сжимает намного эффективнее JPG, поэтому та же картинка в JPG при сопоставимом качестве весит больше. Это нормально; уменьшите качество ползунком, если нужен файл поменьше."
    - q: "Что будет с прозрачностью, HDR и анимацией?"
      a: "В JPG нет прозрачности, поэтому прозрачные области становятся белыми. HDR-изображения сохраняются в обычном диапазоне — цвета могут немного отличаться, и в строке файла появится предупреждение. У анимированного AVIF сохраняется основной кадр."
    - q: "Что происходит с метаданными?"
      a: "По умолчанию сохраняется дата съёмки, если она есть в AVIF, а геолокация и другие сведения удаляются. Если отметить «Сохранить все метаданные», перенесутся все данные EXIF. Цветовой профиль переносится всегда."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
