  description: "Онлайн-конвертер изображений AVIF в JPG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать AVIF в JPG"
  steps:
    - "Нажмите на область выше или перетащите на неё AVIF-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
