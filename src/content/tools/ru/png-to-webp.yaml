# Тексты страницы /png-v-webp. Черновик для проверки владельцем (см. CONTENT.md).
title: "PNG в WebP онлайн — с прозрачностью, с потерями или без"
description: "Конвертируйте PNG в WebP прямо в браузере: прозрачность сохраняется, есть режим без потерь, файлы не загружаются на сервер. Бесплатно."
h1: "Конвертер PNG в WebP"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "PNG в WebP"
card:
  title: "PNG → WebP"
  text: "С прозрачностью — для сайтов и интерфейсов."
app:
  name: "Конвертер PNG в WebP"
  description: "Онлайн-конвертер изображений PNG в WebP с потерями и без, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать PNG в WebP"
  steps:
    - "Нажмите на область выше или перетащите на неё PNG-файлы — можно сразу несколько."
    - "Выберите качество или включите «Без потерь» и подождите: конвертация идёт прямо в браузере."
    - "Скачайте WebP по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Прозрачность сохраняется"
      text: "WebP поддерживает прозрачность, как PNG, — и в режиме с потерями, и без потерь."
    - title: "С потерями или без"
      text: "Без потерь — для графики, иконок и скриншотов; с потерями — для фотографий, когда важнее размер."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить PNG в WebP?"
      a: "WebP поддерживают все современные браузеры, он хранит прозрачность, как PNG, а файлы обычно получаются меньше. Поэтому на сайтах его используют вместо PNG."
    - q: "Сохранится ли прозрачность?"
      a: "Да — и при сжатии с потерями, и без потерь."
    - q: "С потерями или без потерь — что выбрать?"
      a: "Без потерь — для логотипов, иконок, скриншотов и графики с текстом: пиксели сохраняются точно. С потерями — для фотографий и сложных изображений: файл будет заметно меньше."
    - q: "Будет ли WebP меньше PNG?"
      a: "Обычно да, особенно при сжатии с потерями. Размер до и после показан в строке каждого файла."
    - q: "А если PNG анимированный?"
      a: "Анимация не переносится: сохранится первый кадр, а в строке файла появится предупреждение."
    - q: "Что происходит с метаданными?"
      a: "По умолчанию сохраняется дата съёмки, если она есть в PNG, а геолокация и другие сведения удаляются. Если отметить «Сохранить все метаданные», перенесутся все данные EXIF. Цветовой профиль переносится всегда."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
