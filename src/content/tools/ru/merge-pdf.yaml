# Тексты страницы /obedinit-pdf. Черновик для проверки владельцем (см. CONTENT.md).
title: "Объединить PDF онлайн — несколько файлов в один PDF"
description: "Объедините несколько PDF в один документ прямо в браузере: в нужном порядке, без потери качества, без регистрации и загрузки файлов на сервер."
h1: "Объединить PDF"
subtitle: "Несколько документов — в один PDF, в нужном порядке. Файлы не покидают ваше устройство."
breadcrumb: "Объединить PDF"
card:
  title: "Объединить PDF"
  text: "Склеить несколько PDF в один документ."
app:
  name: "Объединение PDF онлайн"
  description: "Онлайн-сервис, который объединяет PDF-файлы в один документ прямо в браузере, без загрузки файлов на сервер."
howTo:
  title: "Как объединить PDF"
  steps:
    - "Нажмите на область выше или перетащите на неё PDF-файлы — у каждого появятся превью и число страниц."
    - "Расставьте документы в нужном порядке стрелками, лишние уберите крестиком."
    - "Нажмите «Объединить PDF» — готовый документ сразу скачается."
why:
  title: "Почему здесь"
  items:
    - title: "Документы остаются у вас"
      text: "PDF объединяются прямо в браузере — договоры, выписки и сканы не загружаются на сервер."
    - title: "Без потери качества"
      text: "Страницы копируются как есть: текст остаётся текстом, а картинки не пересжимаются."
    - title: "Порядок под контролем"
      text: "Превью первой страницы и число страниц помогают расставить документы, не открывая их."
    - title: "Бесплатно и без регистрации"
      text: "До 100 документов за раз, без водяных знаков."
faq:
  title: "Частые вопросы"
  items:
    - q: "Как объединить несколько PDF в один?"
      a: "Добавьте файлы, расставьте их стрелками в нужном порядке и нажмите «Объединить PDF». Страницы попадут в документ в том же порядке."
    - q: "Ухудшится ли качество?"
      a: "Нет. Страницы переносятся без перерисовки: текст остаётся текстом — его можно выделять и искать, — а картинки остаются прежними."
    - q: "Можно ли объединить PDF с паролем?"
      a: "Нет: защищённый паролем PDF нужно сначала открыть и сохранить копию без пароля. Такой файл будет отмечен в списке и в документ не попадёт."
    - q: "Можно ли добавить картинки?"
      a: "Для этого есть «JPG в PDF»: соберите картинки в PDF, а затем объедините его с другими документами здесь."
    - q: "Сохранятся ли оглавление и формы?"
      a: "Страницы, их текст, картинки и пометки переносятся. Оглавление (закладки) исходных документов и интерактивные поля форм могут не сохраниться."
    - q: "Сколько файлов можно объединить?"
      a: "До 100 документов за раз. Большие PDF объединяются дольше и требуют больше памяти — на телефоне их лучше объединять частями."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам инструмент, а PDF объединяются в вашем браузере и не отправляются на сервер."
