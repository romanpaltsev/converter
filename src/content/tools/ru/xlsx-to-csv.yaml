# Тексты страницы /xlsx-v-csv. Черновик для проверки владельцем (см. CONTENT.md).
title: "Excel (XLSX) в CSV онлайн — бесплатно, без загрузки"
description: "Конвертируйте таблицы Excel XLSX в CSV прямо в браузере: UTF-8, разделитель на выбор, даты в понятном виде. Бесплатно, без регистрации и загрузки на сервер."
h1: "Конвертер XLSX в CSV"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "XLSX в CSV"
card:
  title: "XLSX → CSV"
  text: "Таблица Excel — в CSV для импорта и программ."
app:
  name: "Конвертер XLSX в CSV"
  description: "Онлайн-конвертер XLSX в CSV, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать XLSX в CSV"
  steps:
    - "Нажмите на область выше или перетащите на неё XLSX-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте CSV по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Документы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Разделитель на выбор"
      text: "Точка с запятой — для русского Excel, запятая — для программ и Google Таблиц, табуляция — для TSV."
    - title: "Значения, а не формулы"
      text: "В CSV попадают значения ячеек, как их показывает Excel, даты — в виде 2024-07-15."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Какой лист попадёт в CSV?"
      a: "Первый лист книги. CSV — один лист, поэтому, если листов несколько, в строке файла появится предупреждение."
    - q: "Что будет с формулами?"
      a: "В CSV записываются значения, которые Excel сохранил в файле при последнем пересчёте, а не сами формулы."
    - q: "Как записываются даты?"
      a: "Даты — в виде 2024-07-15, дата со временем — 2024-07-15 14:30:00: так их понимают и программы, и Excel."
    - q: "Почему разделитель — точка с запятой?"
      a: "Русский Excel открывает CSV с точкой с запятой, а с запятой показывает всё в одном столбце. Для Google Таблиц и программ выберите в настройках запятую."
    - q: "В какой кодировке CSV?"
      a: "В UTF-8 с меткой BOM — Excel открывает такой файл без кракозябр."
    - q: "Подойдёт ли старый формат XLS?"
      a: "Нет, только XLSX — формат Excel 2007 и новее. Файл XLS можно пересохранить в XLSX в самом Excel."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а файл обрабатывается в вашем браузере и не отправляется на сервер."
