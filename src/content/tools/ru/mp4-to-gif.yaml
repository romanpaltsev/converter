title: "MP4 в GIF онлайн — видео в гифку бесплатно"
description: "Сделайте GIF из видео MP4 прямо в браузере: ширина и частота кадров на выбор. Бесплатно, без регистрации, видео не загружается на сервер."
h1: "Конвертер MP4 в GIF"
subtitle: "Видео — в GIF-анимацию. Бесплатно, без регистрации, файлы не покидают ваше устройство."
breadcrumb: "MP4 в GIF"
card:
  title: "MP4 → GIF"
  text: "Короткое видео — в GIF-анимацию для чатов и сайтов."
app:
  name: "Конвертер MP4 в GIF"
  description: "Онлайн-конвертер видео MP4 в GIF, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать MP4 в GIF"
  steps:
    - "Нажмите на область выше или перетащите на неё MP4-файлы — можно сразу несколько."
    - "Подождите: видео обрабатывается прямо в браузере и никуда не отправляется. Ход виден в процентах."
    - "Скачайте GIF по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Видео остаётся у вас"
      text: "Конвертация выполняется на вашем устройстве. Видео не загружается на сервер, поэтому его не видит никто, кроме вас."
    - title: "Размер под задачу"
      text: "Ширина 320, 480 или 640 точек и 10, 15 или 20 кадров в секунду — чем меньше, тем легче файл."
    - title: "Своя палитра у каждого кадра"
      text: "Для каждого кадра подбираются свои 256 цветов, поэтому цвета передаются точнее."
    - title: "Сразу много файлов"
      text: "Добавьте несколько видео за раз и скачайте результат по одному или одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Сколько видео попадёт в GIF?"
      a: "Первые 20 секунд. GIF не сжимает кадры так, как видео, и минута анимации весила бы десятки мегабайт. Если видео длиннее, в строке файла появится предупреждение."
    - q: "Будет ли звук?"
      a: "Нет, GIF — анимация без звука."
    - q: "Как сделать GIF поменьше?"
      a: "Выберите ширину 320 точек и 10 кадров в секунду. Размер GIF растёт с площадью кадра и числом кадров."
    - q: "Какие видео подходят?"
      a: "MP4, MOV, WebM и MKV — если браузер умеет декодировать их видео. Самые распространённые кодеки (H.264, VP9) поддерживают все современные браузеры."
    - q: "Будет ли GIF повторяться?"
      a: "Да, анимация повторяется бесконечно, как привыкли в чатах и соцсетях."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а видео обрабатывается в вашем браузере и не отправляется на сервер."
