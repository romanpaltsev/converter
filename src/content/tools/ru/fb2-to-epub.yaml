faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить FB2 в EPUB?"
      a: "FB2 популярен в русскоязычных библиотеках, но Apple Books, Google Play Книги, Kobo и Kindle его не открывают. EPUB — общий стандарт электронных книг, его читают почти все устройства и программы."
    - q: "Подойдёт ли EPUB для Kindle?"
      a: "Да. Новые Kindle принимают EPUB через «Отправить на Kindle» (Send to Kindle) — Amazon сам переведёт книгу в свой формат."
    - q: "Подойдут ли файлы .fb2.zip?"
      a: "Да. Книги FB2 часто раздают в ZIP-архиве — конвертер сам найдёт файл внутри. Кодировка тоже определяется сама, в том числе windows-1251 у старых книг."
    - q: "Что будет с картинками?"
      a: "Обложка и иллюстрации в JPEG и PNG переносятся. Картинки в других форматах читалки поддерживают плохо, поэтому они пропускаются, а в строке файла появляется предупреждение."
    - q: "Сохранится ли оформление?"
      a: "Сохраняются структура и начертание: главы и их заголовки, жирный и курсив, эпиграфы, стихи, цитаты, таблицы. Оформление текста задаёт сама читалка — шрифт и его размер можно настроить в ней."
    - q: "Можно ли конвертировать несколько книг?"
      a: "Да, до 100 файлов за раз. Готовые книги можно скачать по одной или все сразу одним ZIP-архивом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а книга обрабатывается в вашем браузере и не отправляется на сервер."
