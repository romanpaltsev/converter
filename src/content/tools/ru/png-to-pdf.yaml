# Тексты страницы /png-v-pdf. Черновик для проверки владельцем (см. CONTENT.md).
title: "PNG в PDF онлайн — картинки и скриншоты в один PDF"
description: "Соберите PNG-картинки и скриншоты в PDF прямо в браузере: без потери качества, с прозрачностью, страницы A4 или по размеру картинки. Без загрузки на сервер."
h1: "PNG в PDF"
subtitle: "Скриншоты и картинки — в один PDF без потери качества. Файлы не покидают ваше устройство."
breadcrumb: "PNG в PDF"
card:
  title: "PNG в PDF"
  text: "Скриншоты и картинки PNG — в один PDF без потерь."
app:
  name: "Конвертер PNG в PDF"
  description: "Онлайн-сервис, который собирает PNG-изображения в PDF прямо в браузере, без загрузки файлов на сервер."
howTo:
  title: "Как сделать PDF из PNG"
  steps:
    - "Нажмите на область выше или перетащите на неё PNG — можно сразу много: каждая картинка станет страницей."
    - "Расставьте страницы кнопками со стрелками и выберите размер: A4, Letter или по размеру картинки, с полями или без."
    - "Нажмите «Скачать PDF» — документ соберётся прямо в браузере."
why:
  title: "Почему здесь"
  items:
    - title: "Чёткий текст на скриншотах"
      text: "PNG сжимаются в PDF без потерь: мелкий текст, схемы и интерфейсы остаются резкими."
    - title: "Прозрачность сохраняется"
      text: "Прозрачные области остаются прозрачными — на странице под ними будет белый лист, а не чёрный фон."
    - title: "Файлы остаются у вас"
      text: "PDF собирается на вашем устройстве — картинки никуда не загружаются."
    - title: "Любые форматы в одном PDF"
      text: "Вместе с PNG можно добавить JPG, HEIC, WebP и другие изображения — все станут страницами одного документа."
faq:
  title: "Частые вопросы"
  items:
    - q: "Как объединить несколько PNG в один PDF?"
      a: "Добавьте все картинки сразу или по очереди — каждая станет отдельной страницей. Порядок меняется кнопками со стрелками в строке файла, лишнее убирается крестиком. Затем нажмите «Скачать PDF»."
    - q: "Сохраняется ли качество PNG?"
      a: "Да. PNG сжимаются в PDF без потерь — пиксели те же, что в исходном файле. Чёрно-белые картинки и сканы сохраняются в оттенках серого, это уменьшает PDF."
    - q: "Что будет с прозрачностью?"
      a: "Прозрачность сохраняется: в программах просмотра PDF прозрачные области выглядят белыми — как лист бумаги."
    - q: "Почему PDF из PNG больше, чем из JPG?"
      a: "PNG хранит изображение без потерь, поэтому и в PDF оно занимает больше места. Если размер важнее, сначала сожмите картинки или переведите их в JPG."
    - q: "Какой размер страницы выбрать?"
      a: "Для печати и документов — A4 (в США — Letter): картинка впишется в лист с сохранением пропорций. «По размеру фото» сделает страницу ровно под изображение — без белых полей."
    - q: "Можно ли добавить фото в других форматах?"
      a: "Да: JPG, HEIC, WebP, AVIF, GIF, BMP, TIFF и JPEG XL. Фото JPG вставляются без перекодирования, форматы с потерями — в высоком качестве."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам инструмент, а PDF собирается в вашем браузере — файлы не отправляются на сервер."
