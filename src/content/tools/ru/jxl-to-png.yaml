faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое JPEG XL?"
      a: "JPEG XL (.jxl) — новый формат изображений: он сжимает лучше JPG и PNG и умеет хранить снимки без потерь. Но открывают его пока не все программы и сайты, а PNG понимают везде."
    - q: "Почему PNG намного больше, чем JXL?"
      a: "JPEG XL сжимает гораздо эффективнее, а PNG хранит фотографию без потерь, поэтому файл может стать в разы больше. Если важен размер, выберите JPG или WebP."
    - q: "Изменится ли изображение?"
      a: "Пиксели переносятся без потерь. Если JXL хранит больше 8 бит на канал, PNG сохранится с 8 битами: на экране разницы не видно."
    - q: "Что будет с анимацией?"
      a: "Сохранится первый кадр анимированного JXL, а в строке файла появится пояснение."
    - q: "Сохранятся ли цвета?"
      a: "Да. Цветовой профиль изображения переносится в PNG, поэтому цвета не тускнеют."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
