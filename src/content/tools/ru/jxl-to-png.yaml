  description: "Онлайн-конвертер изображений JPEG XL в PNG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать JPEG XL в PNG"
  steps:
    - "Нажмите на область выше или перетащите на неё файлы .jxl — можно сразу несколько."
