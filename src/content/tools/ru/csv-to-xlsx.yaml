title: "CSV в Excel (XLSX) онлайн — бесплатно, без загрузки"
description: "Конвертируйте CSV в Excel XLSX прямо в браузере: разделитель и кодировка определяются сами, числа остаются числами. Бесплатно, без регистрации и загрузки на сервер."
h1: "Конвертер CSV в XLSX"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "CSV в XLSX"
card:
  title: "CSV → XLSX"
  text: "Выгрузка CSV — в таблицу Excel без кракозябр."
app:
  name: "Конвертер CSV в XLSX"
  description: "Онлайн-конвертер CSV в XLSX, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать CSV в XLSX"
  steps:
    - "Нажмите на область выше или перетащите на неё CSV-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте XLSX по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Документы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Без кракозябр"
      text: "Кодировка (UTF-8 или Windows-1251) и разделитель (запятая, точка с запятой, табуляция) определяются сами."
    - title: "Числа — числами"
      text: "Числа в XLSX сразу числовые, а коды с ведущими нулями остаются текстом."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить CSV в XLSX?"
      a: "Excel открывает CSV по своим правилам: путает кодировку, разделитель, превращает коды в числа и теряет ведущие нули. В XLSX всё уже разложено по столбцам — файл открывается одинаково везде."
    - q: "Какой разделитель нужен?"
      a: "Любой: запятая, точка с запятой или табуляция определяются автоматически по содержимому файла. Подходит и TSV."
    - q: "Что будет с числами?"
      a: "Числа становятся числами: с ними можно считать. Значения с ведущими нулями — коды, телефоны, индексы — остаются текстом, чтобы нули не пропали."
    - q: "А если текст в другой кодировке?"
      a: "Кодировка определяется сама: UTF-8, UTF-16 или Windows-1251 — в ней сохраняют файлы старые версии «Блокнота» и русский Excel."
    - q: "А даты?"
      a: "Даты переносятся текстом в том виде, в каком записаны в CSV, — без пересчёта в другой формат."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а файл обрабатывается в вашем браузере и не отправляется на сервер."
