# Тексты страницы /jpg-v-pdf. Черновик для проверки владельцем (см. CONTENT.md).
title: "JPG в PDF онлайн — объединить фото в один PDF"
description: "Сделайте PDF из JPG прямо в браузере: несколько фото в один документ, страницы A4, Letter или по размеру фото. Без перекодирования и загрузки на сервер."
h1: "JPG в PDF"
subtitle: "Несколько фото — в один PDF, в нужном порядке. Бесплатно, файлы не покидают ваше устройство."
breadcrumb: "JPG в PDF"
card:
  title: "JPG в PDF"
  text: "Собрать фото и сканы в один PDF-документ."
app:
  name: "Конвертер JPG в PDF"
  description: "Онлайн-сервис, который собирает JPG-изображения в PDF прямо в браузере, без загрузки файлов на сервер."
howTo:
  title: "Как сделать PDF из JPG"
  steps:
    - "Нажмите на область выше или перетащите на неё JPG — можно сразу много: каждая картинка станет страницей."
    - "Расставьте страницы кнопками со стрелками и выберите размер: A4, Letter или по размеру фото, с полями или без."
    - "Нажмите «Скачать PDF» — документ соберётся прямо в браузере."
why:
  title: "Почему здесь"
  items:
    - title: "Без потери качества"
      text: "JPG попадают в PDF как есть, без повторного сжатия: качество фото и сканов не страдает, а документ получается не больше исходных файлов."
    - title: "Файлы остаются у вас"
      text: "PDF собирается на вашем устройстве. Сканы паспорта, договоры и личные фото не загружаются на сервер."
    - title: "Порядок и размер страниц"
      text: "Переставьте страницы, выберите A4 или Letter — альбомные снимки лягут на альбомный лист автоматически."
    - title: "Без лишних данных"
      text: "Геолокация, модель телефона и другие метаданные фото в PDF не попадают — только сами изображения."
faq:
  title: "Частые вопросы"
  items:
    - q: "Как объединить несколько JPG в один PDF?"
      a: "Добавьте все фото сразу или по очереди — каждое станет отдельной страницей. Порядок меняется кнопками со стрелками в строке файла, лишнее убирается крестиком. Затем нажмите «Скачать PDF»."
    - q: "Ухудшится ли качество фото?"
      a: "Нет. JPG вставляются в PDF без перекодирования — это те же данные, что и в исходном файле. Поэтому и размер PDF примерно равен сумме размеров фото."
    - q: "Какой размер страницы выбрать?"
      a: "Для печати и отправки документов — A4 (в США — Letter): картинка впишется в лист с сохранением пропорций. «По размеру фото» сделает страницу ровно под изображение — без белых полей."
    - q: "Почему у вертикального фото страница вертикальная?"
      a: "Ориентация листа выбирается по каждому снимку: портретные фото — на книжный лист, альбомные — на альбомный. Поворот из EXIF учитывается, поэтому фото не окажутся на боку."
    - q: "Можно ли добавить PNG, HEIC и другие форматы?"
      a: "Да. В один PDF можно собрать JPG, PNG, HEIC, WebP, AVIF, GIF, BMP, TIFF и JPEG XL. PNG и другие форматы без потерь сохраняются без потерь, остальные — в высоком качестве."
    - q: "Сохранятся ли геолокация и дата съёмки?"
      a: "Нет, метаданные фото в PDF не переносятся: в документе будут только изображения. Это удобно, если отправляете сканы или фото посторонним."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам инструмент, а PDF собирается в вашем браузере — файлы не отправляются на сервер."
    - q: "Есть ли ограничения?"
      a: "За один раз можно добавить до 100 изображений. Размер страниц и поля можно менять и после добавления файлов — обрабатывать их заново не нужно."
