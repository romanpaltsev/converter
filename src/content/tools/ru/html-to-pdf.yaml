# Тексты страницы /html-v-pdf. Черновик для проверки владельцем (см. CONTENT.md).
title: "HTML в PDF онлайн — текст веб-страницы в PDF бесплатно"
description: "Конвертируйте сохранённые HTML-страницы в PDF прямо в браузере: заголовки, абзацы, списки и таблицы. Бесплатно, без регистрации и загрузки на сервер."
h1: "Конвертер HTML в PDF"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "HTML в PDF"
card:
  title: "HTML → PDF"
  text: "Сохранённая веб-страница — в PDF с текстом и структурой."
app:
  name: "Конвертер HTML в PDF"
  description: "Онлайн-конвертер HTML в PDF, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать HTML в PDF"
  steps:
    - "Нажмите на область выше или перетащите на неё HTML-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте PDF по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Документы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Структура документа"
      text: "Заголовки, абзацы, списки, цитаты, код и таблицы переносятся как в исходном файле."
    - title: "Без мусора"
      text: "Скрипты, стили, меню и прочая служебная разметка пропускаются — в PDF только содержимое."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Будет ли PDF выглядеть как страница в браузере?"
      a: "Нет: переносятся текст и структура — заголовки, абзацы, списки, таблицы, код, — но не оформление CSS, колонки и картинки. Получается аккуратный текстовый документ. Точную копию страницы даёт печать в PDF из самого браузера."
    - q: "Подойдут ли письма и экспорт из программ?"
      a: "Да, если это файл .html или .htm: письма, сохранённые страницы, отчёты и экспорт заметок конвертируются одинаково."
    - q: "А картинки?"
      a: "Картинки не переносятся — только текст. Если они были, в строке файла появится предупреждение."
    - q: "Как выглядит PDF?"
      a: "Страницы A4 с полями 20 мм, шрифт Liberation Sans 11 пт с кириллицей. Длинные строки переносятся по словам, текст можно выделять и копировать."
    - q: "Что будет с иероглифами и эмодзи?"
      a: "В шрифте PDF есть латиница, кириллица и греческий. Знаков, которых в нём нет (иероглифы, эмодзи), в PDF не будет — вместо них «?», а в строке файла появится предупреждение."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а файл обрабатывается в вашем браузере и не отправляется на сервер."
