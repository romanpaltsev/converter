# Тексты страницы /szhat-foto. Черновик для проверки владельцем (см. CONTENT.md).
title: "Сжать фото онлайн — до нужного размера, без загрузки на сервер"
description: "Уменьшите вес фото и картинок JPG, PNG, WebP, HEIC и AVIF прямо в браузере: по качеству или до нужного размера в КБ и МБ. Бесплатно, без регистрации."
h1: "Сжать фото онлайн"
subtitle: "По качеству или до нужного размера. Файлы не покидают ваше устройство."
breadcrumb: "Сжать фото"
card:
  title: "Сжать фото"
  text: "Уменьшить вес снимка — по качеству или до нужного размера в КБ и МБ."
app:
  name: "Сжатие фото онлайн"
  description: "Онлайн-сервис для сжатия фотографий и картинок, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как сжать фото"
  steps:
    - "Выберите режим: «По качеству» — ползунком, или «До размера» — укажите, сколько килобайт или мегабайт должен весить файл."
    - "Нажмите на область выше или перетащите на неё фото — можно сразу несколько. Сжатие идёт прямо в браузере."
    - "Скачайте файлы по одному или все сразу ZIP-архивом. В строке каждого файла видно, насколько он уменьшился."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Сжатие выполняется на вашем устройстве. Фотографии не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Точно в нужный размер"
      text: "Нужен файл не больше 500 КБ или 1 МБ для анкеты или сайта? Укажите размер — качество подберётся само."
    - title: "Формат сохраняется"
      text: "JPG остаётся JPG, PNG — PNG, WebP — WebP. Фото HEIC с iPhone и AVIF сохраняются в JPG. При желании формат можно сменить."
    - title: "Сразу много файлов"
      text: "Сожмите до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Как сжать фото до нужного размера, например до 1 МБ?"
      a: "Выберите режим «До размера», введите число и единицу — КБ или МБ — и добавьте фото. Конвертер несколько раз пересожмёт снимок с разным качеством и сохранит вариант с наибольшим качеством, который укладывается в заданный размер."
    - q: "Почему файл получился меньше, чем я указал?"
      a: "Размер подбирается так, чтобы точно не превысить лимит, поэтому файл обычно немного меньше заданного. Килобайт и мегабайт считаются десятичными (1 МБ = 1 000 000 байт), чтобы файл прошёл проверку на любом сайте."
    - q: "Что делать, если файл не сжимается до нужного размера?"
      a: "Если даже при минимальном качестве файл больше лимита, сохранится самый маленький вариант, а в строке файла появится подсказка. Тогда уменьшите изображение в пикселях — от разрешения размер файла зависит сильнее всего."
    - q: "Сильно ли ухудшится качество?"
      a: "При качестве 75 (значение по умолчанию) разница с оригиналом на фотографиях обычно почти не заметна, а файл получается заметно легче. Чем ниже качество, тем меньше файл и тем заметнее артефакты сжатия."
    - q: "Можно ли сжать PNG?"
      a: "Да, но PNG хранит изображение без потерь, поэтому сильно уменьшить его нельзя. Если прозрачность не нужна, выберите JPG; если нужна — WebP: он сохраняет прозрачность и весит в разы меньше."
    - q: "Почему файл не стал меньше?"
      a: "Если исходник уже был сильно сжат, повторное сжатие почти ничего не даёт. Уменьшите качество или выберите формат WebP — в строке файла видно, как изменился размер."
    - q: "Что происходит с геолокацией и датой съёмки?"
      a: "По умолчанию дата и время съёмки сохраняются, а геолокация, модель телефона и другие служебные данные удаляются — заодно это немного уменьшает файл. Чтобы перенести все метаданные, отметьте «Сохранить все метаданные»."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам инструмент, а фотографии обрабатываются в вашем браузере и не отправляются на сервер."
