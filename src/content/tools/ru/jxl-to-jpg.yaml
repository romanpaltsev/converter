# Тексты страницы /jxl-v-jpg. Черновик для проверки владельцем (см. CONTENT.md).
title: "JPEG XL в JPG онлайн — бесплатно, без загрузки на сервер"
description: "Конвертируйте изображения JPEG XL (.jxl) в JPG прямо в браузере, чтобы открыть их где угодно. Бесплатно, без регистрации, файлы не загружаются на сервер."
h1: "Конвертер JPEG XL в JPG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "JPEG XL в JPG"
card:
  title: "JPEG XL → JPG"
  text: "Новый формат .jxl — в JPG, который открывается везде."
app:
  name: "Конвертер JPEG XL в JPG"
  description: "Онлайн-конвертер изображений JPEG XL в JPG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать JPEG XL в JPG"
  steps:
    - "Нажмите на область выше или перетащите на неё файлы .jxl — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте JPG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Цвета и поворот сохраняются"
      text: "Цветовой профиль переносится в JPG, а снимок поворачивается так, как задано в файле JPEG XL."
    - title: "Сжатие MozJPEG"
      text: "JPG создаётся кодировщиком MozJPEG от Mozilla. Качество настраивается ползунком."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое JPEG XL?"
      a: "JPEG XL (.jxl) — новый формат изображений: он сжимает лучше JPG и умеет хранить снимки без потерь. Но открывают его пока не все программы и браузеры, поэтому для пересылки и публикации удобнее JPG."
    - q: "Почему JPG получается больше, чем JXL?"
      a: "JPEG XL сжимает эффективнее, поэтому тот же снимок в JPG при сопоставимом качестве весит больше. Это нормально; если нужен файл поменьше, уменьшите качество ползунком."
    - q: "Что будет с анимацией?"
      a: "JPG хранит одно изображение, поэтому из анимированного JXL сохранится первый кадр, а в строке файла появится пояснение."
    - q: "Что происходит с метаданными?"
      a: "По умолчанию сохраняется дата съёмки, а геолокация и сведения о камере удаляются; галочка «Сохранить все метаданные» переносит всё. Метаданные, сжатые внутри JXL (так по умолчанию делает cjxl), пока не читаются — тогда в JPG их не будет. Цветовой профиль переносится всегда."
    - q: "Что делать с прозрачностью?"
      a: "В JPG прозрачности нет, поэтому прозрачные области ложатся на белый фон. Чтобы сохранить прозрачность, выберите PNG или WebP."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
