faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить FB2 в PDF?"
      a: "PDF открывается на любом компьютере, планшете и телефоне без отдельной читалки и одинаково выглядит при печати."
    - q: "Как выглядит PDF?"
      a: "Страницы A4: титул с обложкой, названием и авторами, затем главы — каждая с новой страницы. Текст набран шрифтом с кириллицей, его можно выделять и искать, иллюстрации — на своих местах."
    - q: "Подойдут ли файлы .fb2.zip?"
      a: "Да. Книги FB2 часто раздают в ZIP-архиве — конвертер сам найдёт файл внутри. Кодировка тоже определяется сама, в том числе windows-1251 у старых книг."
    - q: "Где примечания?"
      a: "Примечания из FB2 собираются в отдельную главу в конце книги."
    - q: "Что будет с картинками?"
      a: "Обложка и иллюстрации в JPEG и PNG переносятся. Картинки в других форматах читалки поддерживают плохо, поэтому они пропускаются, а в строке файла появляется предупреждение."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а книга обрабатывается в вашем браузере и не отправляется на сервер."
