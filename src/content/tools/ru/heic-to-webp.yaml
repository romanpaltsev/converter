faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое WebP и зачем он нужен?"
      a: "WebP — формат изображений от Google, который понимают все современные браузеры. Его используют на сайтах: при сопоставимом качестве фотографии в WebP обычно занимают меньше места, чем в JPG, и страницы загружаются быстрее."
    - q: "Откроется ли WebP на телефоне и компьютере?"
      a: "WebP поддерживают все современные браузеры, а также Android, iOS и macOS. Некоторые программы и старые фоторедакторы его не открывают — для них лучше выбрать JPG."
    - q: "С потерями или без потерь — что выбрать?"
      a: "Для фотографий обычно достаточно сжатия с потерями: при качестве 90 (значение по умолчанию) разница на глаз не видна. Режим «Без потерь» сохраняет пиксели точно, но файлы получаются заметно больше."
    - q: "Что такое HEIC?"
      a: "HEIC — формат фотографий, в котором по умолчанию снимают iPhone и iPad. Он хранит снимки компактно, но открывается не везде: многие сайты и программы его не понимают."
    - q: "Сохранятся ли поворот и цвета снимка?"
      a: "Да. Фото будет повёрнуто так же, как в галерее телефона, а цветовой профиль (на iPhone это обычно Display P3) переносится в WebP."
    - q: "Что происходит с геолокацией и датой съёмки?"
      a: "По умолчанию дата и время съёмки сохраняются, а геолокация, модель телефона, серийные номера и другие служебные данные удаляются. Если отметить «Сохранить все метаданные», в WebP перенесутся все данные EXIF, включая координаты."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а фотографии обрабатываются в вашем браузере и не отправляются на сервер."
