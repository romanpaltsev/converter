# Тексты страницы /csv-v-json. Черновик для проверки владельцем (см. CONTENT.md).
title: "CSV в JSON онлайн — бесплатно, без загрузки на сервер"
description: "Конвертируйте CSV в JSON прямо в браузере: первая строка — ключи, числа — числами. Бесплатно, без регистрации, файлы не загружаются на сервер."
h1: "Конвертер CSV в JSON"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "CSV в JSON"
card:
  title: "CSV → JSON"
  text: "Таблица CSV — в массив объектов JSON."
app:
  name: "Конвертер CSV в JSON"
  description: "Онлайн-конвертер CSV в JSON, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать CSV в JSON"
  steps:
    - "Нажмите на область выше или перетащите на неё CSV-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте JSON по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Документы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Массив объектов"
      text: "Первая строка — ключи, каждая следующая — объект. Такой JSON сразу подходит для кода и API."
    - title: "Разделитель и кодировка — сами"
      text: "Запятая, точка с запятой или табуляция и кодировка UTF-8 или Windows-1251 определяются автоматически."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Какой получится JSON?"
      a: "Массив объектов: ключи — из первой строки CSV, значения — из следующих строк. JSON отформатирован с отступами, чтобы его было удобно читать."
    - q: "Что будет с числами?"
      a: "Числа становятся числами: с ними можно считать. Значения с ведущими нулями — коды, телефоны, индексы — остаются текстом, чтобы нули не пропали."
    - q: "Что, если в заголовке пустая ячейка?"
      a: "Столбец без названия получает ключ column_N, где N — его номер."
    - q: "А если текст в другой кодировке?"
      a: "Кодировка определяется сама: UTF-8, UTF-16 или Windows-1251 — в ней сохраняют файлы старые версии «Блокнота» и русский Excel."
    - q: "Сколько файлов можно конвертировать за раз?"
      a: "До 100 файлов за раз. Готовые файлы можно скачать по одному или все сразу одним ZIP-архивом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а файл обрабатывается в вашем браузере и не отправляется на сервер."
