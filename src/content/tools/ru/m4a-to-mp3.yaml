faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое M4A?"
      a: "M4A — это звук AAC в контейнере MP4. В нём сохраняют записи «Диктофона» на iPhone, музыку из iTunes и многие программы. MP3 же открывается в любом плеере, автомагнитоле и на старых устройствах."
    - q: "Подойдут ли записи с диктофона iPhone?"
      a: "Да, записи «Диктофона» — это файлы M4A, они конвертируются как обычно. Для речи хватит битрейта 128 кбит/с."
    - q: "Какой битрейт выбрать?"
      a: "192 кбит/с — хороший выбор для музыки, его используют музыкальные сервисы. 320 кбит/с — максимум для MP3: качество чуть выше, файл больше. Для речи, подкастов и лекций хватит 128 кбит/с."
    - q: "Теряется ли качество?"
      a: "И AAC, и MP3 сжимают с потерями, поэтому при конвертации качество немного снижается. Чтобы потери не были заметны, выберите битрейт не ниже исходного."
    - q: "Конвертируются ли покупки из iTunes?"
      a: "Старые покупки iTunes с защитой от копирования (DRM) браузер прочитать не может. Песни без защиты конвертируются как обычные файлы."
    - q: "Сохранятся ли название и исполнитель?"
      a: "Да. Теги исходного файла — название, исполнитель, альбом и другие — переносятся в новый файл."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а записи обрабатываются в вашем браузере и не отправляются на сервер."
