faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое OGG?"
      a: "OGG — контейнер, в котором обычно хранят звук Vorbis или Opus. Его используют игры, некоторые сайты и Telegram для голосовых сообщений. Но не все плееры и программы его открывают, а MP3 понимают везде."
    - q: "Подойдут ли голосовые сообщения из Telegram?"
      a: "Да. Сохранённые голосовые сообщения Telegram — это Opus в OGG, конвертер их читает. Для речи хватит битрейта 128 кбит/с."
    - q: "Какой битрейт выбрать?"
      a: "192 кбит/с — хороший выбор для музыки, его используют музыкальные сервисы. 320 кбит/с — максимум для MP3: качество чуть выше, файл больше. Для речи, подкастов и лекций хватит 128 кбит/с."
    - q: "Теряется ли качество?"
      a: "И Vorbis, и Opus, и MP3 сжимают с потерями, поэтому при конвертации качество немного снижается. Чтобы потери не были заметны, выберите битрейт 192 кбит/с или выше."
    - q: "Сохранятся ли название и исполнитель?"
      a: "Да. Теги исходного файла — название, исполнитель, альбом и другие — переносятся в новый файл."
    - q: "Сколько файлов можно конвертировать за раз?"
      a: "До 100 файлов за раз. Готовые файлы можно скачать по одному или все сразу одним ZIP-архивом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а записи обрабатываются в вашем браузере и не отправляются на сервер."
