title: "TXT в PDF онлайн — текстовый файл в PDF бесплатно"
description: "Конвертируйте текстовые файлы TXT в PDF прямо в браузере: кириллица, переносы строк, A4. Бесплатно, без регистрации и загрузки на сервер."
h1: "Конвертер TXT в PDF"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "TXT в PDF"
card:
  title: "TXT → PDF"
  text: "Текстовый файл — в PDF для печати и отправки."
app:
  name: "Конвертер TXT в PDF"
  description: "Онлайн-конвертер TXT в PDF, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать TXT в PDF"
  steps:
    - "Нажмите на область выше или перетащите на неё TXT-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте PDF по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Документы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Переносы строк сохраняются"
      text: "Каждая строка остаётся на своём месте, длинные строки переносятся по словам, пустые строки — тоже."
    - title: "Кириллица и любая кодировка"
      text: "Кодировка определяется сама — UTF-8, UTF-16 или Windows-1251, а шрифт PDF поддерживает кириллицу."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить TXT в PDF?"
      a: "PDF одинаково выглядит на любом устройстве и удобен для печати и отправки: получатель увидит текст ровно таким, каким вы его отправили."
    - q: "Как выглядит PDF?"
      a: "Страницы A4 с полями 20 мм, шрифт Liberation Sans 11 пт с кириллицей. Длинные строки переносятся по словам, текст можно выделять и копировать."
    - q: "А если текст в другой кодировке?"
      a: "Кодировка определяется сама: UTF-8, UTF-16 или Windows-1251 — в ней сохраняют файлы старые версии «Блокнота» и русский Excel."
    - q: "Что будет с иероглифами и эмодзи?"
      a: "В шрифте PDF есть латиница, кириллица и греческий. Знаков, которых в нём нет (иероглифы, эмодзи), в PDF не будет — вместо них «?», а в строке файла появится предупреждение."
    - q: "Сколько файлов можно конвертировать за раз?"
      a: "До 100 файлов за раз. Готовые файлы можно скачать по одному или все сразу одним ZIP-архивом."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а файл обрабатывается в вашем браузере и не отправляется на сервер."
