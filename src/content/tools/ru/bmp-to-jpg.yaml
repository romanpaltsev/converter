# Тексты страницы /bmp-v-jpg. Черновик для проверки владельцем (см. CONTENT.md).
title: "BMP в JPG онлайн — бесплатно, без загрузки на сервер"
description: "Конвертируйте изображения BMP в JPG прямо в браузере: файл станет в разы легче. Бесплатно, без регистрации, файлы не загружаются на сервер."
h1: "Конвертер BMP в JPG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "BMP в JPG"
card:
  title: "BMP → JPG"
  text: "Тяжёлый BMP — в лёгкий JPG для почты, сайтов и мессенджеров."
app:
  name: "Конвертер BMP в JPG"
  description: "Онлайн-конвертер изображений BMP в JPG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать BMP в JPG"
  steps:
    - "Нажмите на область выше или перетащите на неё BMP-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте JPG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Файл в разы легче"
      text: "BMP обычно хранит изображение без сжатия, а JPG сжимает его — для фотографий и скриншотов разница в размере обычно многократная."
    - title: "Сжатие MozJPEG"
      text: "JPG создаётся кодировщиком MozJPEG от Mozilla. Качество настраивается ползунком."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое BMP?"
      a: "BMP — старый формат изображений Windows. Обычно он хранит каждый пиксель без сжатия, поэтому файлы получаются большими, и многие сайты и мессенджеры их не принимают."
    - q: "Насколько уменьшится файл?"
      a: "Зависит от изображения, но обычно в разы: BMP обычно не сжат. Размер до и после виден в строке каждого файла."
    - q: "Теряется ли качество?"
      a: "JPG сжимает с потерями, поэтому изображение немного меняется. При качестве 90 (значение по умолчанию) разница на глаз обычно не видна. Если нужна точная копия, выберите PNG — он тоже заметно легче BMP."
    - q: "Какие BMP поддерживаются?"
      a: "Почти все, что встречаются на практике: 1, 4, 8, 16, 24 и 32 бита на пиксель, со сжатием RLE и без, включая файлы с прозрачностью и встроенным цветовым профилем."
    - q: "Что будет с прозрачностью?"
      a: "В JPG прозрачности нет, поэтому прозрачные области ложатся на белый фон. Чтобы сохранить прозрачность, выберите PNG или WebP."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
