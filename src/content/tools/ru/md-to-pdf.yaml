# Тексты страницы /md-v-pdf. Черновик для проверки владельцем (см. CONTENT.md).
title: "Markdown в PDF онлайн — MD в PDF бесплатно"
description: "Конвертируйте Markdown (.md) в PDF прямо в браузере: заголовки, списки, таблицы и код. Бесплатно, без регистрации, файлы не загружаются на сервер."
h1: "Конвертер Markdown в PDF"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "Markdown в PDF"
card:
  title: "Markdown → PDF"
  text: "README и заметки — в аккуратный PDF."
app:
  name: "Конвертер Markdown в PDF"
  description: "Онлайн-конвертер Markdown в PDF, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать Markdown в PDF"
  steps:
    - "Нажмите на область выше или перетащите на неё Markdown-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте PDF по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Документы не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Вся разметка"
      text: "Заголовки, жирный и курсив, списки (в том числе вложенные и с флажками), цитаты, блоки кода и таблицы."
    - title: "Текст остаётся текстом"
      text: "PDF собирается из текста, а не из картинки: его можно выделять, искать и копировать."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 файлов за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что из Markdown попадёт в PDF?"
      a: "Заголовки, абзацы, жирный и курсив, списки (нумерованные, маркированные, вложенные, с флажками), цитаты, блоки кода, таблицы, горизонтальные линии. Ссылки выделяются синим с подчёркиванием."
    - q: "А картинки?"
      a: "Картинки не переносятся — только текст. Если в файле были картинки, в строке файла появится предупреждение."
    - q: "Как выглядит PDF?"
      a: "Страницы A4 с полями 20 мм, шрифт Liberation Sans 11 пт с кириллицей. Длинные строки переносятся по словам, текст можно выделять и копировать."
    - q: "Что будет с иероглифами и эмодзи?"
      a: "В шрифте PDF есть латиница, кириллица и греческий. Знаков, которых в нём нет (иероглифы, эмодзи), в PDF не будет — вместо них «?», а в строке файла появится предупреждение."
    - q: "Какой Markdown поддерживается?"
      a: "Распространённый вариант GitHub Flavored Markdown: таблицы, списки задач, зачёркивание и автоссылки."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а файл обрабатывается в вашем браузере и не отправляется на сервер."
