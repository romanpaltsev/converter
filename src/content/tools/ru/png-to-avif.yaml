# Тексты страницы /png-v-avif. Черновик для проверки владельцем (см. CONTENT.md).
title: "PNG в AVIF онлайн — с прозрачностью, без загрузки на сервер"
description: "Конвертируйте картинки PNG в AVIF прямо в браузере: прозрачность сохраняется, а файлы обычно становятся в разы легче. Бесплатно, без регистрации."
h1: "Конвертер PNG в AVIF"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "PNG в AVIF"
card:
  title: "PNG → AVIF"
  text: "С прозрачностью и в разы легче — для сайтов и интерфейсов."
app:
  name: "Конвертер PNG в AVIF"
  description: "Онлайн-конвертер изображений PNG в AVIF, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать PNG в AVIF"
  steps:
    - "Нажмите на область выше или перетащите на неё PNG-файлы — можно сразу несколько."
    - "Подождите: кодирование AVIF идёт прямо в браузере и занимает больше времени, чем JPG или WebP."
    - "Скачайте AVIF по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Прозрачность сохраняется"
      text: "AVIF поддерживает прозрачность, поэтому прозрачный фон PNG остаётся прозрачным."
    - title: "В разы легче"
      text: "PNG хранит изображение без потерь, а AVIF сжимает его с потерями — для фотографий и сложных картинок файл обычно становится в разы меньше."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое AVIF?"
      a: "AVIF — современный формат изображений на основе видеокодека AV1. Его поддерживают все современные браузеры, поэтому он удобен для сайтов: страницы грузятся быстрее."
    - q: "Сохранится ли прозрачность?"
      a: "Да. AVIF хранит альфа-канал, поэтому прозрачные области PNG остаются прозрачными."
    - q: "Подходит ли AVIF для скриншотов и логотипов?"
      a: "Для фотографий и сложных иллюстраций — да. Для скриншотов с мелким текстом и логотипов с чёткими краями сжатие с потерями может дать заметные артефакты — их лучше оставить в PNG или поднять качество."
    - q: "Почему кодирование такое долгое?"
      a: "Кодировщик AV1 тщательно подбирает, как сжать каждый участок изображения. В браузере он работает в один поток, поэтому большая картинка может кодироваться десятки секунд."
    - q: "Какое качество выбрать?"
      a: "Значение по умолчанию — 75: на фотографиях разница с оригиналом обычно незаметна. Для картинок с текстом и тонкими линиями лучше поднять качество."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
