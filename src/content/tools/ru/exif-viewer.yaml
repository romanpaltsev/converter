# Тексты страницы /posmotret-exif. Черновик для проверки владельцем (см. CONTENT.md).
title: "Посмотреть EXIF онлайн — метаданные фото, дата и место съёмки"
description: "Узнайте, когда, где и на какую камеру сделано фото: EXIF, геолокация и другие метаданные JPG, HEIC, PNG и WebP — прямо в браузере, без загрузки на сервер."
h1: "Посмотреть EXIF и метаданные фото"
subtitle: "Дата, камера, параметры съёмки и место — прямо в браузере. Файлы не покидают ваше устройство."
breadcrumb: "Посмотреть EXIF"
card:
  title: "Посмотреть EXIF"
  text: "Узнать дату, камеру и место съёмки по метаданным фото."
app:
  name: "Просмотр EXIF онлайн"
  description: "Онлайн-сервис для просмотра EXIF и других метаданных фотографий, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как посмотреть метаданные фото"
  steps:
    - "Нажмите на область выше или перетащите на неё фото — можно сразу несколько. Подойдут JPG, HEIC, PNG, WebP, AVIF, TIFF и другие форматы."
    - "Для каждого файла появится карточка: когда и на что снято, параметры съёмки, место на карте и цветовой профиль. «Все теги EXIF» — полный список."
    - "Если в фото есть лишнее, нажмите «Скачать без метаданных» — получите копию без EXIF, геолокации и XMP."
why:
  title: "Почему здесь"
  items:
    - title: "Фото не загружаются на сервер"
      text: "Метаданные читаются прямо в браузере. Снимки и то, что в них записано, не видит никто, кроме вас."
    - title: "Понятно, а не только теги"
      text: "Дата съёмки, камера, выдержка, диафрагма и ISO показаны по-человечески, а полный список тегов — под спойлером."
    - title: "Место съёмки на карте"
      text: "Если в фото есть координаты, их можно открыть в Яндекс Картах или OpenStreetMap — только когда вы сами нажмёте на ссылку."
    - title: "Сразу и удалить"
      text: "Нашли геолокацию или серийный номер — скачайте копию без метаданных в один клик. Изображение при этом не перекодируется."
faq:
  title: "Частые вопросы"
  items:
    - q: "Что такое EXIF?"
      a: "EXIF — служебные данные, которые камера или телефон записывает в фото: дату и время съёмки, модель устройства, выдержку, диафрагму, ISO, фокусное расстояние, ориентацию, а при включённой геолокации — координаты места."
    - q: "Как узнать, где сделано фото?"
      a: "Добавьте фото: если в нём есть координаты, в карточке появится строка «Геолокация» со ссылками на карты. Если строки нет, координаты при съёмке не записывались или были удалены — например, мессенджером или соцсетью."
    - q: "Как узнать дату съёмки фото?"
      a: "Дата и время съёмки — в строке «Снято». Это время, записанное камерой: оно не зависит от даты создания или изменения файла на диске."
    - q: "Почему у фото нет метаданных?"
      a: "Многие мессенджеры и соцсети удаляют EXIF при отправке, а скриншоты и картинки из интернета часто не содержат его вовсе. Тогда вы увидите «Метаданных не найдено»."
    - q: "Можно ли посмотреть EXIF у HEIC с iPhone?"
      a: "Да. HEIC, AVIF, JPG, PNG, WebP, TIFF и JPEG XL читаются прямо в браузере — даже в тех, которые сами не умеют показывать HEIC."
    - q: "Что за «встроенная миниатюра»?"
      a: "Некоторые камеры и программы сохраняют в EXIF маленькую копию снимка. Бывает, что после обрезки фото в ней остаётся исходный кадр целиком, — поэтому её стоит проверять перед публикацией."
    - q: "Как удалить метаданные?"
      a: "Нажмите «Скачать без метаданных» в карточке файла или откройте «Удалить метаданные», чтобы обработать сразу много фото и выбрать, что оставить, — например, дату съёмки."
    - q: "Безопасно ли это?"
      a: "Да. Файлы читаются в вашем браузере и не отправляются на сервер. Координаты передаются сайту карт, только если вы сами откроете ссылку."
