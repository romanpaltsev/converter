# Тексты страницы /jpg-v-png. Черновик для проверки владельцем (см. CONTENT.md).
title: "JPG в PNG онлайн — бесплатно, без загрузки на сервер"
description: "Конвертируйте JPG в PNG прямо в браузере: бесплатно, без регистрации, файлы не загружаются на сервер. Сохраняются поворот, цветовой профиль и дата съёмки."
h1: "Конвертер JPG в PNG"
subtitle: "Бесплатно и без регистрации. Файлы не покидают ваше устройство."
breadcrumb: "JPG в PNG"
card:
  title: "JPG → PNG"
  text: "Чтобы дальше редактировать картинку без новых потерь качества."
app:
  name: "Конвертер JPG в PNG"
  description: "Онлайн-конвертер изображений JPG в PNG, который работает в браузере без загрузки файлов на сервер."
howTo:
  title: "Как конвертировать JPG в PNG"
  steps:
    - "Нажмите на область выше или перетащите на неё JPG-файлы — можно сразу несколько."
    - "Подождите немного: конвертация идёт прямо в браузере, файлы никуда не отправляются."
    - "Скачайте PNG по одному или все сразу одним ZIP-архивом."
why:
  title: "Почему здесь"
  items:
    - title: "Файлы остаются у вас"
      text: "Конвертация выполняется на вашем устройстве. Изображения не загружаются на сервер, поэтому их не видит никто, кроме вас."
    - title: "Поворот и цвета как в оригинале"
      text: "Если фото повёрнуто с помощью EXIF, PNG получится уже повёрнутым. Цветовой профиль переносится, поэтому цвета не меняются."
    - title: "Метаданные под вашим контролем"
      text: "По умолчанию сохраняется дата съёмки, а геолокация, модель камеры и другие сведения удаляются. Если нужно, сохраните всё одной галочкой."
    - title: "Сразу много файлов"
      text: "Добавьте до 100 изображений за раз и скачайте результат одним ZIP-архивом."
faq:
  title: "Частые вопросы"
  items:
    - q: "Зачем переводить JPG в PNG?"
      a: "PNG хранит изображение без потерь: JPG при каждом новом сохранении теряет немного качества, а PNG — нет. Поэтому PNG удобен, если картинку дальше будут редактировать, или если сайт либо программа принимают только PNG."
    - q: "Станет ли качество лучше?"
      a: "Нет. Конвертация не возвращает детали, которые JPG потерял при сжатии: PNG сохранит изображение ровно таким, какое оно сейчас, и дальше не будет его портить."
    - q: "Почему PNG весит больше, чем JPG?"
      a: "PNG сжимает без потерь, а фотографии с мелкими деталями так сжимаются хуже, поэтому файл обычно получается в несколько раз больше. Для фото, которые не нужно редактировать, удобнее оставить JPG."
    - q: "Появится ли прозрачный фон?"
      a: "Нет. В JPG нет прозрачности, поэтому фон останется таким же, как на исходной картинке. Прозрачность можно добавить потом в графическом редакторе — PNG её поддерживает."
    - q: "Сохранятся ли поворот и цвета?"
      a: "Да. Если камера записала поворот в EXIF, PNG получится уже повёрнутым как надо. Цветовой профиль (например, Display P3) переносится в PNG."
    - q: "Что происходит с геолокацией и датой съёмки?"
      a: "По умолчанию дата и время съёмки сохраняются, а геолокация, модель камеры, серийные номера и другие служебные данные удаляются. Если отметить «Сохранить все метаданные», в PNG перенесутся все данные EXIF, включая координаты."
    - q: "Какие JPG не поддерживаются?"
      a: "Редкие варианты формата: JPEG в цветовой модели CMYK (обычно это макеты для печати), 12-битные, lossless и с арифметическим кодированием. Для них конвертер покажет понятное сообщение."
    - q: "Безопасно ли это?"
      a: "Да. С сайта загружается только сам конвертер, а изображения обрабатываются в вашем браузере и не отправляются на сервер."
