faq:
  title: "Frequently asked questions"
  items:
    - q: "What is AVIF?"
      a: "AVIF is a modern image format based on the AV1 video codec. Every modern browser supports it, which makes it great for websites: pages load faster."
    - q: "Is transparency preserved?"
      a: "Yes. AVIF stores an alpha channel, so transparent areas of the PNG stay transparent."
    - q: "Is AVIF good for screenshots and logos?"
      a: "For photos and complex illustrations, yes. Screenshots with small text and logos with sharp edges may show visible artifacts with lossy compression — keep those as PNG or raise the quality."
    - q: "Why does encoding take so long?"
      a: "The AV1 encoder works hard to find the best way to compress every part of the image. In the browser it runs on a single thread, so a large image can take tens of seconds."
    - q: "Which quality should I choose?"
      a: "The default of 75 is usually indistinguishable from the original on photos. Raise it for images with text and thin lines."
    - q: "Is it safe to convert my images here?"
      a: "Yes. The site only downloads the converter itself; your images are processed in your browser and are never sent to a server."
