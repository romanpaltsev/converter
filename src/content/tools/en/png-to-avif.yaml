why:
  title: "Why use this converter"
  items:
    - title: "Your files stay with you"
      text: "Everything runs on your device. Images are never uploaded to a server, so nobody else ever sees them."
    - title: "Transparency is kept"
      text: "AVIF supports transparency, so a transparent PNG background stays transparent."
    - title: "Several times lighter"
      text: "PNG stores images losslessly, while AVIF uses lossy compression — photos and complex images usually get several times smaller."
    - title: "Batch conversion"
