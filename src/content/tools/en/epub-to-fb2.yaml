title: "EPUB to FB2 Converter — Free, Private, No Upload"
description: "Convert EPUB ebooks to FB2 right in your browser: cover, chapters and illustrations are kept. Free, no sign-up, and your files never leave your device."
h1: "EPUB to FB2 Converter"
subtitle: "EPUB books for readers and apps that use FB2. Free, no sign-up."
breadcrumb: "EPUB to FB2"
card:
  title: "EPUB → FB2"
  text: "EPUB books, as FB2 for PocketBook, ONYX and reader apps."
app:
  name: "EPUB to FB2 Converter"
  description: "An online EPUB to FB2 ebook converter that runs in your browser without uploading your files."
howTo:
  title: "How to convert EPUB to FB2"
  steps:
    - "Click the box above or drag your EPUB books onto it — you can add many at once."
    - "Wait a moment while your browser converts the book. Nothing gets uploaded."
