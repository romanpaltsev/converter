faq:
  title: "Frequently asked questions"
  items:
    - q: "What is a HEIC file?"
      a: "HEIC is the photo format iPhones and iPads use by default. It is based on HEVC compression and stores photos more compactly than JPG, but many apps, websites and older versions of Windows can't open it."
    - q: "How do I open HEIC files on Windows?"
      a: "Windows 10 and 11 need the HEIF Image Extensions and the HEVC Video Extensions from the Microsoft Store (the latter may be paid). Converting to JPG is simpler: every app can open a JPG."
    - q: "How do I make my iPhone take photos in JPG instead of HEIC?"
      a: "Go to Settings → Camera → Formats and choose Most Compatible. New photos will be saved as JPG; the ones you already have stay HEIC, and you can convert them here."
    - q: "Will converting to JPG reduce quality?"
      a: "JPG uses lossy compression, so the image changes slightly. At the default quality of 90 the difference is usually impossible to see, and the resolution stays the same. If you need a lossless copy, pick PNG."
    - q: "Why is the JPG bigger than the original HEIC?"
      a: "HEIC compresses photos more efficiently than JPG, so the same photo at similar quality takes up more space as a JPG. That's expected. Lower the quality slider if you need smaller files."
    - q: "Is it safe to convert my photos here?"
      a: "Yes. The site only downloads the converter itself; your photos are processed in your browser and are never sent to a server."
    - q: "What happens to the location and the date taken?"
      a: "By default the date and time the photo was taken are kept, while GPS location, phone model, serial numbers and other details are removed. Tick “Keep all metadata” to copy the full EXIF data, including location."
    - q: "Will rotation and colors be preserved?"
      a: "Yes. Photos come out rotated the same way as in your phone's gallery, and the color profile (usually Display P3 on iPhones) is carried over, so colors don't look washed out."
