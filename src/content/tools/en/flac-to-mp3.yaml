faq:
  title: "Frequently asked questions"
  items:
    - q: "Why convert FLAC to MP3?"
      a: "FLAC is lossless, so the files are big. An MP3 is several times smaller and plays on any device — handy for phones, car stereos and older players."
    - q: "Which bitrate is best for music?"
      a: "For music from FLAC, 256 or 320 kbps is best; 320 is the MP3 maximum. 192 kbps is a sensible compromise when size matters."
    - q: "Will I lose quality?"
      a: "MP3 is lossy, so the file won't be an exact copy anymore. At 256–320 kbps the difference is usually inaudible. Keep your FLAC originals — you can always make a new MP3 from them."
    - q: "What happens to multichannel audio?"
      a: "MP3 is mono or stereo only, so recordings with more channels are mixed down to stereo."
    - q: "Are the title and artist kept?"
      a: "Yes. The tags of the original file — title, artist, album and others — are copied to the new file."
    - q: "How many files can I convert at once?"
      a: "Up to 100 files per batch. Download them one by one or all together in a single ZIP file."
    - q: "Is it safe?"
      a: "Yes. Only the converter itself is loaded from the site; your recordings are processed in your browser and never sent to a server."
