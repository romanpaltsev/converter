why:
  title: "Why use this converter"
  items:
    - title: "Your video stays with you"
      text: "Conversion runs on your device. Your video is never uploaded, so nobody but you can see it."
    - title: "VP9 and Opus"
      text: "Video is encoded to VP9 and audio to Opus — royalty-free codecs every modern browser supports."
    - title: "Pick quality and size"
      text: "Choose the quality and frame size — from original down to 480p — so the video loads faster on your site."
