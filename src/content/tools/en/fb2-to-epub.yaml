title: "FB2 to EPUB Converter — Free, Private, No Upload"
description: "Convert FB2 ebooks to EPUB right in your browser: cover, chapters, table of contents and illustrations. .fb2.zip works too. Free and no uploads."
h1: "FB2 to EPUB Converter"
subtitle: "FB2 books for Apple Books, Google Play Books, Kindle and other readers. Free, no sign-up."
breadcrumb: "FB2 to EPUB"
card:
  title: "FB2 → EPUB"
  text: "FB2 books, as EPUB for iPhone, Android and Kindle."
app:
  name: "FB2 to EPUB Converter"
  description: "An online FB2 to EPUB ebook converter that runs in your browser without uploading your files."
howTo:
  title: "How to convert FB2 to EPUB"
  steps:
    - "Click the box above or drag your FB2 books onto it — you can add many at once."
