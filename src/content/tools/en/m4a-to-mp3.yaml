faq:
  title: "Frequently asked questions"
  items:
    - q: "What is M4A?"
      a: "M4A is AAC audio in an MP4 container. iPhone Voice Memos, iTunes music and many apps save in it. MP3, on the other hand, plays in any player, car stereo or older device."
    - q: "Do iPhone voice memos work?"
      a: "Yes, Voice Memos recordings are M4A files and convert like any other. For speech, 128 kbps is plenty."
    - q: "Which bitrate should I pick?"
      a: "192 kbps is a good choice for music and matches what streaming services use. 320 kbps is the maximum for MP3: slightly better quality, bigger file. For speech, podcasts and lectures, 128 kbps is plenty."
    - q: "Will I lose quality?"
      a: "Both AAC and MP3 are lossy, so converting costs a little quality. To keep the loss unnoticeable, choose a bitrate no lower than the original's."
    - q: "Can I convert iTunes purchases?"
      a: "Older iTunes purchases with copy protection (DRM) can't be read by the browser. Songs without DRM convert like any other file."
    - q: "Are the title and artist kept?"
      a: "Yes. The tags of the original file — title, artist, album and others — are copied to the new file."
    - q: "Is it safe?"
      a: "Yes. Only the converter itself is loaded from the site; your recordings are processed in your browser and never sent to a server."
