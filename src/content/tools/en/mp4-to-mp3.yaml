title: "MP4 to MP3 Converter — Extract Audio from Video, Free"
description: "Extract the audio from MP4 videos to MP3 right in your browser. Free, no sign-up, and your videos never leave your device. MOV, WebM and MKV work too."
h1: "MP4 to MP3 Converter"
subtitle: "Audio from video, as MP3. Free, no sign-up, your files never leave your device."
breadcrumb: "MP4 to MP3"
card:
  title: "MP4 → MP3"
  text: "The soundtrack of a video, as an MP3 for any player."
app:
  name: "MP4 to MP3 Converter"
  description: "An online MP4 to MP3 converter that extracts audio in your browser without uploading your videos."
howTo:
  title: "How to convert MP4 to MP3"
  steps:
    - "Click the box above or drag your MP4 files onto it — you can add many at once."
    - "Wait while your browser re-encodes the audio — nothing gets uploaded. Progress is shown as a percentage."
