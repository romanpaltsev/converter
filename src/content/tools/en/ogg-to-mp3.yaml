faq:
  title: "Frequently asked questions"
  items:
    - q: "What is OGG?"
      a: "OGG is a container that usually holds Vorbis or Opus audio. Games, some websites and Telegram voice messages use it. Not every player or app opens it, while MP3 works everywhere."
    - q: "Do Telegram voice messages work?"
      a: "Yes. Saved Telegram voice messages are Opus in OGG, and the converter reads them. For speech, 128 kbps is plenty."
    - q: "Which bitrate should I pick?"
      a: "192 kbps is a good choice for music and matches what streaming services use. 320 kbps is the maximum for MP3: slightly better quality, bigger file. For speech, podcasts and lectures, 128 kbps is plenty."
    - q: "Will I lose quality?"
      a: "Vorbis, Opus and MP3 are all lossy, so converting costs a little quality. To keep the loss unnoticeable, choose 192 kbps or higher."
    - q: "Are the title and artist kept?"
      a: "Yes. The tags of the original file — title, artist, album and others — are copied to the new file."
    - q: "How many files can I convert at once?"
      a: "Up to 100 files per batch. Download them one by one or all together in a single ZIP file."
    - q: "Is it safe?"
      a: "Yes. Only the converter itself is loaded from the site; your recordings are processed in your browser and never sent to a server."
