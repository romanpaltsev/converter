why:
  title: "Why use this converter"
  items:
    - title: "Your files stay with you"
      text: "Everything runs on your device. Images are never uploaded to a server, so nobody else ever sees them."
    - title: "Transparency goes white"
      text: "JPG has no transparency, so transparent areas of the WebP are placed neatly on a white background instead of turning black."
    - title: "MozJPEG encoding"
      text: "JPGs are made with MozJPEG, Mozilla's advanced JPEG encoder. Fine-tune the quality with the slider."
    - title: "Batch conversion"
      text: "Convert up to 100 images at a time and download them as a single ZIP file."
faq:
  title: "Frequently asked questions"
  items:
    - q: "What is WebP?"
      a: "WebP is an image format from Google that many websites use because it keeps images small. Not every app, photo editor or service can open it, though, so an image saved from a website is often easier to use as a JPG."
    - q: "Why do images from websites download as WebP?"
      a: "Websites serve images as WebP so pages load faster, and your browser saves the file in the same format. Converting it to JPG makes it work in any app."
    - q: "Will I lose quality?"
      a: "JPG compression is lossy, so the image changes slightly. At the default quality of 90 the difference is usually invisible. If the original WebP was lossless and you need an exact copy, pick PNG."
    - q: "Why is the JPG bigger than the WebP?"
      a: "WebP usually compresses more efficiently than JPG, so the same image at similar quality takes up more space as a JPG. That's expected — lower the quality slider if you need a smaller file."
    - q: "What happens to transparency and animation?"
      a: "JPG has no transparency, so transparent areas turn white. Animation isn't kept either: the first frame is saved, and the file's row shows a warning."
    - q: "What happens to the metadata?"
      a: "By default the capture date is kept if the WebP has one, while the location and other details are removed. Tick “Keep all metadata” to copy the full EXIF data. The color profile is always kept."
    - q: "Is it safe to convert my images here?"
      a: "Yes. The site only downloads the converter itself; your images are processed in your browser and are never sent to a server."
