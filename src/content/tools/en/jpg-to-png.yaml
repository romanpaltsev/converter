title: "JPG to PNG Converter — Free, Private, No Upload"
description: "Convert JPG images to PNG right in your browser. Free, no sign-up, and your files never leave your device. Rotation, color profile and capture date are kept."
h1: "JPG to PNG Converter"
subtitle: "Free, no sign-up. Your files never leave your device."
breadcrumb: "JPG to PNG"
card:
  title: "JPG → PNG"
  text: "Keep editing an image without losing any more quality."
app:
  name: "JPG to PNG Converter"
  description: "An online JPG to PNG converter that runs in your browser without uploading your images."
howTo:
  title: "How to convert JPG to PNG"
  steps:
    - "Click the box above or drag your JPG files onto it — you can add many at once."
    - "Wait a moment while your browser converts them. Nothing gets uploaded."
