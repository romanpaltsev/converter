faq:
  title: "Frequently asked questions"
  items:
    - q: "What is JPEG XL?"
      a: "JPEG XL (.jxl) is a new image format: it compresses better than JPG and PNG and can store images losslessly. Not every app or website opens it yet, while PNG works everywhere."
    - q: "Why is the PNG so much bigger than the JXL?"
      a: "JPEG XL compresses far more efficiently, while PNG stores photos losslessly, so the file can get several times larger. If size matters, choose JPG or WebP."
    - q: "Will the image change?"
      a: "Pixels are copied losslessly. If the JXL stores more than 8 bits per channel, the PNG is saved with 8 bits: you won't see the difference on screen."
    - q: "What happens to an animation?"
      a: "The first frame of an animated JXL is saved and the file's row tells you about it."
    - q: "Are the colors preserved?"
      a: "Yes. The image's color profile is copied into the PNG, so colors don't look washed out."
    - q: "Is it safe to convert my images here?"
      a: "Yes. The site only downloads the converter itself; your images are processed in your browser and are never sent to a server."
