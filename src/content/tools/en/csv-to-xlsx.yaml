title: "CSV to Excel (XLSX) Converter — Free, No Upload"
description: "Convert CSV to Excel XLSX right in your browser: delimiter and encoding are detected, numbers stay numbers. Free, no sign-up, and your files never leave your device."
h1: "CSV to XLSX Converter"
subtitle: "Free, no sign-up. Your files never leave your device."
breadcrumb: "CSV to XLSX"
card:
  title: "CSV → XLSX"
  text: "A CSV export, as a proper Excel spreadsheet."
app:
  name: "CSV to XLSX Converter"
  description: "An online CSV to XLSX converter that runs in your browser without uploading your files."
