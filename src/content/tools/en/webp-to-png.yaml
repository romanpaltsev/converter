faq:
  title: "Frequently asked questions"
  items:
    - q: "What is WebP?"
      a: "WebP is Google's image format, popular on websites because images stay small. Many apps and editors still can't open it, which is why converting to a common format such as PNG helps."
    - q: "PNG or JPG — which should I pick?"
      a: "Pick PNG when you need transparency or an exact, lossless copy: logos, icons, screenshots and images you'll keep editing. Pick JPG for photos when a small file matters more."
    - q: "Is transparency preserved?"
      a: "Yes. PNG supports transparency, so transparent areas of the WebP stay transparent."
    - q: "Why is the PNG bigger than the WebP?"
      a: "PNG is lossless, while WebP often stores images lossily and compresses them more efficiently, so the PNG is usually larger. For photos where size matters, choose JPG."
    - q: "What if the WebP is animated?"
      a: "Animation isn't carried over to PNG: the first frame is saved, and the file's row shows a warning."
    - q: "What happens to the metadata?"
      a: "By default the capture date is kept if the WebP has one, while the location and other details are removed. Tick “Keep all metadata” to copy the full EXIF data. The color profile is always kept."
    - q: "Is it safe to convert my images here?"
      a: "Yes. The site only downloads the converter itself; your images are processed in your browser and are never sent to a server."
