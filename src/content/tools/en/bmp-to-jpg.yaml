h1: "BMP to JPG Converter"
subtitle: "Free, no sign-up. Your files never leave your device."
breadcrumb: "BMP to JPG"
card:
  title: "BMP → JPG"
  text: "Turn a bulky BMP into a light JPG for email, websites and chat."
app:
  name: "BMP to JPG Converter"
