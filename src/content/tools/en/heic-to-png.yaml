why:
  title: "Why use this converter"
  items:
    - title: "Your photos stay with you"
      text: "Everything runs on your device. Photos are never uploaded to a server, so nobody else ever sees them."
    - title: "No quality loss"
      text: "PNG keeps every pixel exactly as it is — handy when the photo is headed for an editor or a printer."
    - title: "You control the metadata"
      text: "By default we keep the date the photo was taken and strip the location and other details. One checkbox keeps everything."
    - title: "Batch conversion"
