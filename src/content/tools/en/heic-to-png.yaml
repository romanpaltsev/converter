faq:
  title: "Frequently asked questions"
  items:
    - q: "What's the difference between PNG and JPG?"
      a: "PNG is lossless: not a single pixel changes. JPG uses lossy compression but makes files several times smaller. JPG is usually better for sharing photos, PNG for editing and printing."
    - q: "Why are the PNG files so large?"
      a: "Lossless compression can't throw away fine detail, and photos are full of it. A 24 MP iPhone photo saved as PNG takes tens of megabytes. If file size matters, choose JPG."
    - q: "What is a HEIC file?"
      a: "HEIC is the photo format iPhones and iPads use by default. It stores photos compactly, but many apps and websites can't open it."
    - q: "Is transparency preserved?"
      a: "Yes. If a HEIC file has transparency (an alpha channel), it is carried over to the PNG. Regular camera photos don't have transparency."
    - q: "Will rotation and colors be preserved?"
      a: "Yes. Photos come out rotated the same way as in your phone's gallery, and the color profile (usually Display P3 on iPhones) is embedded in the PNG, so colors don't look washed out."
    - q: "Is it safe to convert my photos here?"
      a: "Yes. The site only downloads the converter itself; your photos are processed in your browser and are never sent to a server."
    - q: "What happens to the location and the date taken?"
      a: "By default the date and time the photo was taken are kept, while GPS location, phone model and other details are removed. Tick “Keep all metadata” to copy the full EXIF data, including location."
