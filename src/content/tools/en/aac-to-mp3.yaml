faq:
  title: "Frequently asked questions"
  items:
    - q: "What is AAC?"
      a: "AAC is the codec behind the audio of most MP4 videos, iPhone recordings and Apple Music. A .aac file is a bare AAC stream with no container; not every player or car stereo opens it, while MP3 works everywhere."
    - q: "Can I avoid re-encoding?"
      a: "Yes, if M4A works for you: pick it in the format menu and the AAC stream is moved into an M4A container as is, with no loss. iPhones, Android and most players understand it."
    - q: "Which bitrate should I pick?"
      a: "192 kbps is a good choice for music and matches what streaming services use. 320 kbps is the maximum for MP3: slightly better quality, bigger file. For speech, podcasts and lectures, 128 kbps is plenty."
    - q: "Will I lose quality?"
      a: "Both AAC and MP3 are lossy, so converting costs a little quality. To keep the loss unnoticeable, choose a bitrate no lower than the original's."
    - q: "How many files can I convert at once?"
      a: "Up to 100 files per batch. Download them one by one or all together in a single ZIP file."
    - q: "Is it safe?"
      a: "Yes. Only the converter itself is loaded from the site; your recordings are processed in your browser and never sent to a server."
