faq:
  title: "Frequently asked questions"
  items:
    - q: "What is JPEG XL?"
      a: "JPEG XL (.jxl) is a new image format: it compresses better than JPG and can store images losslessly. Not every app or browser opens it yet, so JPG is handier for sharing and publishing."
    - q: "Why is the JPG bigger than the JXL?"
      a: "JPEG XL compresses more efficiently, so the same image at similar quality takes more space as a JPG. That's expected; lower the quality slider if you need a smaller file."
    - q: "What happens to an animation?"
      a: "A JPG holds a single image, so the first frame of an animated JXL is saved and the file's row tells you about it."
    - q: "What happens to the metadata?"
      a: "By default the capture date is kept, while the location and camera details are removed; tick “Keep all metadata” to copy everything. Metadata compressed inside the JXL (what cjxl does by default) can't be read yet, so it won't appear in the JPG. The color profile is always kept."
    - q: "What about transparency?"
      a: "JPG has no transparency, so transparent areas are placed on a white background. To keep transparency, choose PNG or WebP."
    - q: "Is it safe to convert my images here?"
      a: "Yes. The site only downloads the converter itself; your images are processed in your browser and are never sent to a server."
