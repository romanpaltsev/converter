why:
  title: "Why use this converter"
  items:
    - title: "Your files stay with you"
      text: "Everything runs on your device. Photos are never uploaded to a server, so nobody else ever sees them."
    - title: "Lighter at the same quality"
      text: "AVIF is based on the AV1 video codec and usually compresses photos better than JPG. Each file's row shows the size before and after."
    - title: "Colors and metadata"
      text: "The color profile is copied into the AVIF. By default the capture date is kept and the location is removed."
