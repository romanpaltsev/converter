why:
  title: "Why use this converter"
  items:
    - title: "Your files stay with you"
      text: "Everything runs on your device. Images are never uploaded to a server, so nobody else ever sees them."
    - title: "Quality under control"
      text: "Set the quality with the slider; each file's row shows its size before and after conversion."
    - title: "Rotation and colors preserved"
      text: "If a photo is rotated via EXIF, the WebP comes out already rotated. The color profile is carried over, so colors don't shift."
