faq:
  title: "Frequently asked questions"
  items:
    - q: "Why convert JPG to WebP?"
      a: "Every modern browser supports WebP, which is why websites use it: at comparable quality, photos usually take up less space as WebP than as JPG, so pages load faster."
    - q: "Will the WebP be smaller than the original JPG?"
      a: "Usually, but not always: if the JPG is already heavily compressed, the savings can be small. Each file's row shows the size before and after — lower the quality slider if you need a smaller file."
    - q: "Will the quality get better?"
      a: "No. Converting can't bring back detail the JPG lost, and lossy compression changes the image a little more. At the default quality of 90 the difference is usually invisible."
    - q: "Should I turn on Lossless?"
      a: "For photos that start out as JPG, usually not: a lossless file ends up larger than the original. Lossless is useful for graphics, screenshots and images you'll keep editing."
    - q: "Are rotation and colors preserved?"
      a: "Yes. If the camera stored the rotation in EXIF, the WebP comes out already rotated correctly. The color profile (such as Display P3) is copied into the WebP."
    - q: "What happens to the metadata?"
      a: "By default the capture date is kept, while the location, camera model and other details are removed. Tick “Keep all metadata” to copy the full EXIF data, including location."
    - q: "Is it safe to convert my images here?"
      a: "Yes. The site only downloads the converter itself; your images are processed in your browser and are never sent to a server."
