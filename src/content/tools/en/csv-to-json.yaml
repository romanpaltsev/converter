# Texts for /en/csv-to-json. Draft for the owner's review (see CONTENT.md).
title: "CSV to JSON Converter — Free, Private, No Upload"
description: "Convert CSV to JSON right in your browser: the first row becomes keys, numbers stay numbers. Free, no sign-up, and your files never leave your device."
h1: "CSV to JSON Converter"
subtitle: "Free, no sign-up. Your files never leave your device."
breadcrumb: "CSV to JSON"
card:
  title: "CSV → JSON"
  text: "A CSV table, as a JSON array of objects."
app:
  name: "CSV to JSON Converter"
  description: "An online CSV to JSON converter that runs in your browser without uploading your files."
howTo:
  title: "How to convert CSV to JSON"
  steps:
    - "Click the box above or drag your CSV files onto it — you can add many at once."
    - "Wait a moment while your browser converts them. Nothing gets uploaded."
    - "Download each JSON separately or grab them all in one ZIP file."
why:
  title: "Why use this converter"
  items:
    - title: "Your files stay with you"
      text: "Conversion runs on your device. Documents are never uploaded, so nobody but you can see them."
    - title: "An array of objects"
      text: "The first row gives the keys and every following row becomes an object — ready for code and APIs."
    - title: "Delimiter and encoding detected"
      text: "Comma, semicolon or tab and UTF-8 or Windows-1251 encoding are detected automatically."
    - title: "Many files at once"
      text: "Add up to 100 files at a time and download the results as one ZIP."
faq:
  title: "Frequently asked questions"
  items:
    - q: "What does the JSON look like?"
      a: "An array of objects: keys from the first CSV row, values from the rows below. The JSON is indented so it's easy to read."
    - q: "What happens to numbers?"
      a: "Numbers become real numbers you can calculate with. Values with leading zeros — codes, phone numbers, ZIP codes — stay text so the zeros aren't lost."
    - q: "What if a header cell is empty?"
      a: "A column without a name gets the key column_N, where N is its number."
    - q: "What if the text uses another encoding?"
      a: "The encoding is detected automatically: UTF-8, UTF-16 or Windows-1251, which older Notepad versions and Excel in Cyrillic locales use."
    - q: "How many files can I convert at once?"
      a: "Up to 100 files per batch. Download them one by one or all together in a single ZIP file."
    - q: "Is it safe?"
      a: "Yes. Only the converter itself is loaded from the site; your file is processed in your browser and never sent to a server."
