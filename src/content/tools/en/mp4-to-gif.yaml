title: "MP4 to GIF Converter — Turn Video into a GIF, Free"
description: "Make a GIF from an MP4 video right in your browser, with the width and frame rate you choose. Free, no sign-up, and your video never leaves your device."
h1: "MP4 to GIF Converter"
subtitle: "Video into a GIF animation. Free, no sign-up, your files never leave your device."
breadcrumb: "MP4 to GIF"
card:
  title: "MP4 → GIF"
  text: "A short video, as a GIF for chats and websites."
app:
  name: "MP4 to GIF Converter"
