faq:
  title: "Frequently asked questions"
  items:
    - q: "What is WebP, and why use it?"
      a: "WebP is an image format from Google that every modern browser supports. Websites use it because, at comparable quality, photos usually take up less space as WebP than as JPG, so pages load faster."
    - q: "Will WebP open on my phone and computer?"
      a: "Every modern browser supports WebP, and so do Android, iOS and macOS. Some apps and older photo editors can't open it — pick JPG for those."
    - q: "Lossy or lossless — which should I choose?"
      a: "For photos, lossy compression is usually enough: at the default quality of 90 the difference is invisible. Lossless keeps every pixel exactly, but the files are much larger."
    - q: "What is a HEIC file?"
      a: "HEIC is the photo format iPhones and iPads use by default. It stores photos compactly, but many websites and apps can't open it."
    - q: "Will rotation and colors be preserved?"
      a: "Yes. Photos come out rotated the same way as in your phone's gallery, and the color profile (usually Display P3 on iPhones) is carried over to the WebP."
    - q: "What happens to the location and the date taken?"
      a: "By default the date and time the photo was taken are kept, while GPS location, phone model, serial numbers and other details are removed. Tick “Keep all metadata” to copy the full EXIF data, including location."
    - q: "Is it safe to convert my photos here?"
      a: "Yes. The site only downloads the converter itself; your photos are processed in your browser and are never sent to a server."
