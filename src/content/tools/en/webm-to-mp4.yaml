why:
  title: "Why use this converter"
  items:
    - title: "Your video stays with you"
      text: "Conversion runs on your device. Your video is never uploaded, so nobody but you can see it."
    - title: "H.264 and AAC"
      text: "VP9 or VP8 video is re-encoded to H.264 and Opus audio to AAC, so iPhones, Windows, TVs and editors can open the MP4."
    - title: "Pick quality and size"
      text: "Choose the quality and frame size — from original down to 480p — to make the file smaller."
    - title: "Many files at once"
      text: "Add several videos at a time and download them one by one or as a single ZIP."
faq:
  title: "Frequently asked questions"
  items:
    - q: "What is WebM?"
      a: "WebM is Google's open video format, usually VP9 or VP8 video with Opus audio. YouTube, browser screen recorders and many websites use it. iPhones, older TVs and some editors can't open it, while MP4 works everywhere."
    - q: "What happens to the video and audio?"
      a: "The video is re-encoded to H.264 and the audio to AAC — the standard MP4 pairing that virtually every device supports."
    - q: "Why does it take a while?"
      a: "Re-encoding video is heavy work, and it happens right on your device. A minute of video takes from tens of seconds to a few minutes, depending on resolution and your computer. Progress is shown as a percentage."
    - q: "How do I make the file smaller?"
      a: "Choose “Medium” or “Low” quality and a smaller frame size — 720p or 480p. 720p means the short side of the frame is 720 pixels: for a vertical video that's the width."
    - q: "Do screen recordings work?"
      a: "Yes. Screen recordings made in the browser and by some apps are saved as WebM — the converter turns them into MP4 you can share anywhere."
    - q: "Which browsers does it work in?"
      a: "Up-to-date Chrome, Edge, Firefox and Safari: video is encoded with the browser's built-in codecs (WebCodecs). If your browser lacks a codec, the file's row will tell you."
    - q: "Is it safe?"
      a: "Yes. Only the converter itself is loaded from the site; your video is processed in your browser and never sent to a server."
