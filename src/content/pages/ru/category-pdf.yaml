page: category
category: pdf
title: "Инструменты PDF онлайн — картинки в PDF, PDF в JPG, объединение"
description: "Бесплатные инструменты PDF в браузере: картинки в PDF, страницы PDF в JPG и PNG, объединение PDF. Без регистрации и загрузки на сервер."
h1: "Инструменты PDF"
subtitle: "Картинки в PDF, страницы PDF в картинки и объединение документов."
breadcrumb: "Инструменты PDF"
menu: "Инструменты PDF"
toolsTitle: "Инструменты PDF"
intro: "Соберите фото и сканы в один PDF или сохраните каждую картинку отдельным документом, превратите страницы PDF в JPG или PNG с нужным разрешением, объедините несколько PDF в один. Документы не покидают ваше устройство."
faq:
  title: "Частые вопросы"
  items:
    - q: "Как собрать несколько картинок в один PDF?"
      a: "Откройте «JPG в PDF», добавьте файлы и расставьте их стрелками — каждая картинка станет страницей. Здесь же каждая картинка превращается в свой отдельный PDF."
    - q: "Можно ли открыть PDF с паролем?"
      a: "Нет: документы с паролем не открываются, в строке файла появится сообщение об этом."
    - q: "Как пользоваться?"
      a: "Выберите файлы или перетащите их на страницу, затем у каждого файла выберите формат — или сразу для всех. Готовые файлы можно скачать по одному или одним ZIP-архивом."
    - q: "Файлы загружаются на сервер?"
      a: "Нет. Конвертер работает прямо в браузере: файлы обрабатываются на вашем устройстве и никуда не отправляются."
