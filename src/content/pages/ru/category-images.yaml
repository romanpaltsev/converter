title: "Конвертер изображений онлайн — HEIC, JPG, PNG, WebP, AVIF"
description: "Бесплатный конвертер изображений в браузере: HEIC, JPG, PNG, WebP, AVIF, GIF, BMP, TIFF и JPEG XL в JPG, PNG, WebP, AVIF или ICO. Без регистрации и загрузки на сервер."
h1: "Конвертер изображений"
subtitle: "HEIC, JPG, PNG, WebP, AVIF, GIF, BMP, TIFF и JPEG XL — в нужный формат прямо в браузере."
breadcrumb: "Конвертер изображений"
menu: "Конвертер изображений"
toolsTitle: "Конвертеры изображений"
intro: "Фото с iPhone в HEIC, картинки с сайтов в WebP и AVIF, сканы в TIFF — всё переводится в JPG, PNG, WebP, AVIF или иконку ICO. Цветовой профиль переносится, поворот по EXIF применяется, а метаданные можно сохранить или оставить только дату съёмки."
faq:
  title: "Частые вопросы"
  items:
    - q: "Какие форматы поддерживаются?"
      a: "На входе — HEIC и HEIF, AVIF, JPG, PNG, WebP, GIF, BMP, TIFF и JPEG XL. На выходе — JPG, PNG, WebP, AVIF, ICO, а ещё PDF: каждую картинку можно сохранить отдельным документом."
    - q: "Что будет с качеством?"
      a: "JPG, WebP и AVIF сжимают с потерями — качество настраивается ползунком, по умолчанию 90. PNG сохраняет каждый пиксель без потерь."
    - q: "Как пользоваться?"
      a: "Выберите файлы или перетащите их на страницу, затем у каждого файла выберите формат — или сразу для всех. Готовые файлы можно скачать по одному или одним ZIP-архивом."
    - q: "Это бесплатно?"
      a: "Да, без регистрации и без ограничений по числу конвертаций. За раз можно добавить до 100 файлов."
    - q: "Файлы загружаются на сервер?"
      a: "Нет. Конвертер работает прямо в браузере: файлы обрабатываются на вашем устройстве и никуда не отправляются."
