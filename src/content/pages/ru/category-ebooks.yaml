description: "Бесплатный конвертер электронных книг в браузере: FB2 в EPUB и обратно, FB2 и EPUB в PDF, FB2 в TXT. Без регистрации и загрузки на сервер."
h1: "Конвертер электронных книг"
subtitle: "FB2 и EPUB друг в друга, в PDF и в обычный текст — прямо в браузере."
breadcrumb: "Конвертер электронных книг"
menu: "Конвертер электронных книг"
toolsTitle: "Конвертеры электронных книг"
intro: "Книги из русскоязычных библиотек в FB2 открываются на iPhone, Android и Kindle после перевода в EPUB, а EPUB — в читалках, которые любят FB2. Обложка, авторы, аннотация, главы, иллюстрации и примечания переносятся; книгу можно сохранить и в PDF для печати."
faq:
  title: "Частые вопросы"
  items:
    - q: "Какие форматы поддерживаются?"
      a: "На входе — FB2 (в том числе .fb2.zip) и EPUB. На выходе — EPUB, FB2, PDF и TXT."
    - q: "Подойдут ли купленные книги?"
      a: "Книги с защитой от копирования (DRM) прочитать нельзя. Книги без защиты — из библиотек, личные и бесплатные — конвертируются как обычно."
    - q: "Как пользоваться?"
      a: "Выберите файлы или перетащите их на страницу, затем у каждого файла выберите формат — или сразу для всех. Готовые файлы можно скачать по одному или одним ZIP-архивом."
    - q: "Файлы загружаются на сервер?"
      a: "Нет. Конвертер работает прямо в браузере: файлы обрабатываются на вашем устройстве и никуда не отправляются."
