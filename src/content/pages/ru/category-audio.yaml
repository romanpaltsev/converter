page: category
category: audio
title: "Конвертер аудио онлайн — MP3, WAV, M4A, OGG, FLAC"
description: "Бесплатный аудиоконвертер в браузере: MP3, WAV, M4A, OGG, FLAC, Opus и AAC друг в друга, звук из видео в MP3. Без регистрации и загрузки на сервер."
h1: "Конвертер аудио"
subtitle: "MP3, WAV, M4A, OGG и FLAC — и звук из видео — прямо в браузере."
breadcrumb: "Конвертер аудио"
menu: "Конвертер аудио"
toolsTitle: "Конвертеры аудио"
intro: "Переводите музыку, голосовые сообщения и записи диктофона между MP3, WAV, M4A, OGG и FLAC, извлекайте звук из видео. Битрейт — от 128 до 320 кбит/с, теги (название, исполнитель, альбом) переносятся, а если кодек тот же — звук копируется без перекодирования."
faq:
  title: "Частые вопросы"
  items:
    - q: "Какие форматы поддерживаются?"
      a: "На входе — MP3, WAV, FLAC, OGG, Opus, AAC, M4A, а ещё звук из видео MP4, MOV, WebM и MKV. На выходе — MP3, WAV, M4A, OGG (Opus) и FLAC."
    - q: "Какой битрейт выбрать?"
      a: "192 кбит/с — хороший выбор для музыки, 320 кбит/с — максимум для MP3. Для речи и подкастов хватит 128 кбит/с."
    - q: "Как пользоваться?"
      a: "Выберите файлы или перетащите их на страницу, затем у каждого файла выберите формат — или сразу для всех. Готовые файлы можно скачать по одному или одним ZIP-архивом."
    - q: "Файлы загружаются на сервер?"
      a: "Нет. Конвертер работает прямо в браузере: файлы обрабатываются на вашем устройстве и никуда не отправляются."
