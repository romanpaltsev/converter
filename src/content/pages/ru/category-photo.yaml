page: category
category: photo
title: "Обработка фото онлайн — сжать, изменить размер, убрать EXIF"
description: "Бесплатные инструменты для фото в браузере: сжатие до нужного размера, изменение размера, удаление и просмотр метаданных. Без регистрации и загрузки на сервер."
h1: "Обработка фото"
subtitle: "Сжатие, изменение размера и метаданные — формат файла остаётся прежним."
breadcrumb: "Обработка фото"
menu: "Обработка фото"
toolsTitle: "Инструменты для фото"
intro: "Уменьшите вес фото для почты и сайта — по качеству или до нужного размера в КБ и МБ, — подгоните размер под соцсети, уберите геолокацию и модель телефона перед публикацией или посмотрите, что записано в EXIF. Всё работает прямо в браузере."
faq:
  title: "Частые вопросы"
  items:
    - q: "Чем сжатие отличается от изменения размера?"
      a: "Сжатие уменьшает вес файла, не меняя число пикселей: подбирается качество. Изменение размера уменьшает само изображение — например, до 1920 точек по длинной стороне."
    - q: "Что такое метаданные фото?"
      a: "Сведения, которые камера записывает в файл: дата и время, модель телефона, настройки съёмки и часто геолокация. Перед публикацией их стоит удалить."
    - q: "Это бесплатно?"
      a: "Да, без регистрации и без ограничений по числу конвертаций. За раз можно добавить до 100 файлов."
    - q: "Файлы загружаются на сервер?"
      a: "Нет. Конвертер работает прямо в браузере: файлы обрабатываются на вашем устройстве и никуда не отправляются."
