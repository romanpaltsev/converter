page: category
category: video
title: "Конвертер видео онлайн — MOV, MKV, WebM в MP4, видео в GIF"
description: "Бесплатный видеоконвертер в браузере: MOV, MKV и WebM в MP4, MP4 в WebM, видео в GIF и звук из видео. Без регистрации и загрузки на сервер."
h1: "Конвертер видео"
subtitle: "MOV, MKV и WebM в MP4, MP4 в WebM и видео в GIF — прямо в браузере."
breadcrumb: "Конвертер видео"
menu: "Конвертер видео"
toolsTitle: "Конвертеры видео"
intro: "Видео с iPhone и камер, записи экрана и фильмы переводятся в MP4 (H.264 и AAC) или WebM (VP9 и Opus) с нужным качеством и размером кадра, короткие ролики — в GIF. Если кодеки подходят, видео перепаковывается за секунды и без потерь."
faq:
  title: "Частые вопросы"
  items:
    - q: "Какие форматы поддерживаются?"
      a: "На входе — MP4, MOV, WebM и MKV. На выходе — MP4, WebM и GIF, а ещё звук в MP3, WAV, M4A, OGG и FLAC."
    - q: "Почему конвертация идёт долго?"
      a: "Видео перекодируется прямо на вашем устройстве встроенными кодеками браузера. Минута видео обрабатывается от десятков секунд до нескольких минут; MOV и MKV с H.264 перепаковываются в MP4 за секунды."
    - q: "Как пользоваться?"
      a: "Выберите файлы или перетащите их на страницу, затем у каждого файла выберите формат — или сразу для всех. Готовые файлы можно скачать по одному или одним ZIP-архивом."
    - q: "Файлы загружаются на сервер?"
      a: "Нет. Конвертер работает прямо в браузере: файлы обрабатываются на вашем устройстве и никуда не отправляются."
