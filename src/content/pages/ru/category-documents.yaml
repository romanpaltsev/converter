page: category
category: documents
title: "Конвертер документов онлайн — TXT, Markdown, HTML в PDF, CSV в Excel"
description: "Бесплатный конвертер документов в браузере: TXT, Markdown и HTML в PDF, Markdown в HTML, CSV, Excel XLSX и JSON друг в друга. Без загрузки на сервер."
h1: "Конвертер документов"
subtitle: "Текст в PDF и таблицы CSV, Excel и JSON друг в друга — прямо в браузере."
breadcrumb: "Конвертер документов"
menu: "Конвертер документов"
toolsTitle: "Конвертеры документов"
intro: "Текстовые файлы, заметки в Markdown и сохранённые веб-страницы превращаются в аккуратный PDF с кириллицей, Markdown — в готовую HTML-страницу. Таблицы CSV, Excel и JSON переводятся друг в друга: разделитель и кодировка определяются сами, числа остаются числами."
faq:
  title: "Частые вопросы"
  items:
    - q: "Какие форматы поддерживаются?"
      a: "Текст: TXT, Markdown и HTML — в PDF, Markdown — и в HTML, HTML — и в TXT. Таблицы: CSV (и TSV), Excel XLSX и JSON — друг в друга."
    - q: "А документы Word?"
      a: "Пока нет: чтобы точно перенести вёрстку DOCX в PDF, нужен целый офисный пакет. Если документ можно сохранить как HTML или TXT, сконвертируйте его в PDF здесь."
    - q: "Как пользоваться?"
      a: "Выберите файлы или перетащите их на страницу, затем у каждого файла выберите формат — или сразу для всех. Готовые файлы можно скачать по одному или одним ZIP-архивом."
    - q: "Файлы загружаются на сервер?"
      a: "Нет. Конвертер работает прямо в браузере: файлы обрабатываются на вашем устройстве и никуда не отправляются."
